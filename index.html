<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Asian Games 2026 — India</title>
<style>
  :root{
    --bg:#0a0f1e;
    --bg-soft:#111832;
    --card:#151d33;
    --card-2:#1a2340;
    --text:#e9eefb;
    --muted:#8d99b8;
    --line:rgba(255,255,255,.08);
    --accent:#5b8cff;
    --accent-2:#8a5bff;
    --gold:#ffd35c;
    --silver:#c9d2e3;
    --bronze:#e29a5c;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(91,140,255,.18), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(138,91,255,.16), transparent 55%),
      var(--bg);
    min-height:100%;
    padding-bottom:40px;
  }
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    padding:14px 16px 10px;
    background:rgba(10,15,30,.78);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .logo{
    width:42px;height:42px;border-radius:13px;flex:0 0 auto;
    display:grid;place-items:center;
    font-weight:800;font-size:15px;letter-spacing:.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 8px 22px rgba(91,140,255,.35);
  }
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .brand .open-btn{
    margin-left:auto;border:1px solid var(--line);background:var(--card);
    border-radius:12px;padding:8px 11px;font-size:12px;color:var(--muted);
  }

  .search{position:relative;display:block}
  .search svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;opacity:.55;pointer-events:none;
  }
  .search input{
    width:100%;padding:12px 40px 12px 38px;
    background:var(--bg-soft);border:1px solid var(--line);
    border-radius:14px;color:var(--text);font-size:14px;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input::placeholder{color:#69769180}
  .search input:focus{border-color:rgba(91,140,255,.6);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
  .search .clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--muted);font-size:18px;
    width:28px;height:28px;border-radius:50%;display:none;
  }
  .search.has-value .clear{display:block}

  /* ---------- Status strip ---------- */
  .status{
    display:flex;align-items:center;gap:8px;
    padding:8px 16px 0;font-size:11px;color:var(--muted);
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;background:#43d17d;
    box-shadow:0 0 8px rgba(67,209,125,.6);
  }
  .status .dot.stale{background:#ffb84d;box-shadow:0 0 8px rgba(255,184,77,.6)}
  .status .dot.err{background:#ff5c7a;box-shadow:0 0 8px rgba(255,92,122,.6)}
  .status .refresh{
    margin-left:auto;border:1px solid var(--line);background:var(--card);
    border-radius:10px;padding:5px 9px;font-size:11px;color:var(--muted);
  }
  .status .refresh:active{transform:scale(.96)}

  /* ---------- Chips ---------- */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chips + .chips{padding-top:8px}
  .chip{
    flex:0 0 auto;padding:7px 13px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
    color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;
    transition:.18s;
  }
  .chip:active{transform:scale(.96)}
  .chip.on{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;border-color:transparent;
    box-shadow:0 6px 16px rgba(91,140,255,.3);
  }
  .chip .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:6px;vertical-align:1px;
  }

  /* ---------- Stats ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
    padding:12px 16px 6px;
  }
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:10px 6px;text-align:center;
  }
  .stat b{display:block;font-size:17px;font-weight:800;line-height:1.1}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .stat.g b{color:var(--gold)}
  .stat.s b{color:var(--silver)}
  .stat.br b{color:var(--bronze)}

  /* ---------- List ---------- */
  main{padding:8px 16px 30px;display:flex;flex-direction:column;gap:10px}
  .card{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(160deg,var(--card),var(--card-2));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 12px;cursor:pointer;
    transition:transform .16s, border-color .16s;
    animation:rise .35s backwards;
  }
  .card:active{transform:scale(.985);border-color:rgba(91,140,255,.4)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .avatar{
    position:relative;width:54px;height:54px;flex:0 0 auto;border-radius:15px;
    background:linear-gradient(135deg,#2a3557,#1b2340);
    display:grid;place-items:center;overflow:hidden;
    font-weight:800;font-size:15px;color:#93a3cc;letter-spacing:.5px;
    border:1px solid var(--line);
  }
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  .info{min-width:0;flex:1}
  .info h3{
    margin:0 0 3px;font-size:14.5px;font-weight:700;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .info .sub{
    margin:0;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .pill{
    font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;
    border:1px solid transparent;white-space:nowrap;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;
  }
  .pill.gold{background:rgba(255,211,92,.14);color:var(--gold);border-color:rgba(255,211,92,.3)}
  .pill.silver{background:rgba(201,210,227,.14);color:var(--silver);border-color:rgba(201,210,227,.28)}
  .pill.bronze{background:rgba(226,154,92,.14);color:var(--bronze);border-color:rgba(226,154,92,.3)}
  .chev{color:#4c5878;font-size:20px;line-height:1;flex:0 0 auto}

  /* ---------- Empty / loader ---------- */
  .empty{
    text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;
  }
  .empty .big{font-size:36px;margin-bottom:10px}
  .drop{
    margin:30px 16px;padding:28px 20px;text-align:center;
    border:1.5px dashed rgba(91,140,255,.4);border-radius:20px;
    background:rgba(91,140,255,.05);
  }
  .drop p{color:var(--muted);font-size:13px;margin:0 0 16px}
  .drop label{
    display:inline-block;padding:11px 20px;border-radius:13px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    font-size:13.5px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 20px rgba(91,140,255,.3);
  }
  .drop input{display:none}

  /* ---------- Detail sheet ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(4,7,16,.65);
    backdrop-filter:blur(3px);z-index:60;opacity:0;transition:opacity .25s;
  }
  .backdrop.show{opacity:1}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    max-width:660px;margin:0 auto;
    background:linear-gradient(180deg,#141c33,#0e1428);
    border-radius:24px 24px 0 0;
    border:1px solid var(--line);border-bottom:0;
    max-height:90dvh;display:flex;flex-direction:column;
    transform:translateY(102%);transition:transform .32s cubic-bezier(.3,.8,.3,1);
    box-shadow:0 -20px 50px rgba(0,0,0,.55);
  }
  .sheet.show{transform:translateY(0)}
  .grab{width:42px;height:4px;border-radius:99px;background:#39445f;margin:10px auto 2px;flex:0 0 auto}
  .sheet-body{overflow-y:auto;padding:12px 18px 34px;-webkit-overflow-scrolling:touch}

  .hero{display:flex;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .hero .avatar{width:72px;height:72px;border-radius:20px;font-size:19px}
  .hero h2{margin:0 0 4px;font-size:17px;line-height:1.25;font-weight:800}
  .hero .meta{font-size:12px;color:var(--muted)}

  .sec{margin-top:18px}
  .sec h4{
    margin:0 0 10px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);font-weight:700;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kv{
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:12px;padding:9px 11px;min-width:0;
  }
  .kv span{display:block;font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
  .kv b{display:block;font-size:13px;font-weight:600;margin-top:2px;word-break:break-word}

  .item{
    display:flex;gap:10px;align-items:flex-start;
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:13px;padding:11px 12px;margin-bottom:8px;
  }
  .item .grow{flex:1;min-width:0}
  .item .t{font-size:13.5px;font-weight:650;line-height:1.3}
  .item .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}

  .tl{position:relative;padding-left:20px;margin-bottom:12px}
  .tl::before{
    content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:1.5px;
    background:linear-gradient(var(--accent),transparent);
  }
  .tl:last-child::before{display:none}
  .tl::after{
    content:"";position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;
    background:var(--bg);border:2.5px solid var(--accent);
  }
  .tl .date{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.3px}
  .tl .title{font-size:13.5px;font-weight:650;margin:3px 0 2px;line-height:1.3}
  .tl .venue{font-size:11.5px;color:var(--muted)}
  .tl .res{
    display:inline-flex;align-items:center;gap:7px;margin-top:6px;
    font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;
    background:rgba(91,140,255,.12);color:#a9c1ff;border:1px solid rgba(91,140,255,.22);
  }
  .close-x{
    position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    display:grid;place-items:center;font-size:16px;color:var(--muted);z-index:2;
  }
  .member{
    display:flex;justify-content:space-between;gap:8px;font-size:12.5px;
    padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.07);
  }
  .member:last-child{border-bottom:0}
  .member span{color:var(--muted);font-size:11px}
  .raw{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10.5px;color:var(--muted);line-height:1.5;
    background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;max-height:220px;overflow:auto;
    white-space:pre-wrap;word-break:break-word;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">AG</div>
    <div>
      <h1>Asian Games 2026</h1>
      <p>India · Athletes &amp; Results</p>
    </div>
    <button class="open-btn" id="openFileBtn">Open JSON</button>
  </div>
  <label class="search" id="searchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" placeholder="Search athlete, sport or event…" autocomplete="off" />
    <button class="clear" id="clearBtn" aria-label="Clear">×</button>
  </label>
</header>

<div class="status" id="status">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">Loading athletes.json…</span>
  <button class="refresh" id="refreshBtn">Refresh</button>
</div>

<div class="chips" id="medalChips"></div>
<div class="chips" id="sportChips"></div>
<div class="stats" id="stats"></div>
<main id="list"></main>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close-x" id="closeSheet">×</button>
  <div class="grab"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<input type="file" id="fileInput" accept=".json,application/json" style="display:none" />

<script>
(() => {
  "use strict";

  // Try these paths in order — first that loads wins.
  const DATA_SOURCES = [
    "data/athletes.json",
    "athletes.json",
  ];

  const AUTO_REFRESH_MS = 5 * 60 * 1000;   // refetch every 5 min
  const STALE_MS        = 60 * 60 * 1000;  // warn if > 1 hour old

  let DATA = [];
  let LAST_LOADED_AT = null;
  const state = { q: "", medal: "all", sport: "all" };

  const $ = (s) => document.querySelector(s);
  const listEl     = $("#list");
  const statsEl    = $("#stats");
  const medalEl    = $("#medalChips");
  const sportEl    = $("#sportChips");
  const sheet      = $("#sheet");
  const sheetBody  = $("#sheetBody");
  const backdrop   = $("#backdrop");
  const searchWrap = $("#searchWrap");
  const qInput     = $("#q");
  const statusEl   = $("#status");
  const statusDot  = $("#statusDot");
  const statusText = $("#statusText");

  /* ---------------- helpers ---------------- */
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  const MEDALS = {
    gold:   { cls:"gold",   icon:"🥇", label:"Gold"   },
    silver: { cls:"silver", icon:"🥈", label:"Silver" },
    bronze: { cls:"bronze", icon:"🥉", label:"Bronze" }
  };
  const medalInfo = (m) => MEDALS[m] || { cls:"", icon:"🏅", label:m || "" };

  const codeToMedal = (code) => {
    if (!code) return null;
    const c = String(code).toUpperCase();
    if (c.includes("GOLD"))   return "gold";
    if (c.includes("SILVER")) return "silver";
    if (c.includes("BRONZE")) return "bronze";
    return null;
  };

  const initials = (name) =>
    String(name || "?").trim().split(/\s+/).slice(0, 2)
      .map(w => w[0]).join("").toUpperCase();

  const fmtDate = (raw) => {
    if (!raw) return "";
    const d = new Date(raw);
    if (isNaN(d)) return "";
    return d.toLocaleString(undefined, {
      day:"2-digit", month:"short", year:"numeric",
      hour:"2-digit", minute:"2-digit"
    });
  };

  const relTime = (ts) => {
    if (!ts) return "";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60)   return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  };

  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

  /* ---------------- status bar ---------------- */
  function setStatus(text, level) {
    statusText.textContent = text;
    statusDot.className = "dot" + (level ? " " + level : "");
  }

  function refreshStatus() {
    if (!LAST_LOADED_AT) return;
    const age = Date.now() - LAST_LOADED_AT;
    const level = age > STALE_MS ? "stale" : "";
    setStatus(
      `${plural(DATA.length, "entry").replace("entrys", "entries")} · updated ${relTime(LAST_LOADED_AT)}`,
      level
    );
  }

  /* ---------------- data loading ---------------- */
  async function loadData() {
    setStatus("Loading athletes.json…");
    for (const url of DATA_SOURCES) {
      try {
        const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Not an array");
        DATA = data;
        LAST_LOADED_AT = Date.now();
        boot();
        setStatus(`Loaded ${plural(DATA.length, "entry").replace("entrys", "entries")} · ${relTime(LAST_LOADED_AT)}`);
        return;
      } catch (e) {
        // try next
      }
    }
    showDropZone();
    setStatus("Could not auto-load athletes.json", "err");
  }

  function showDropZone() {
    listEl.innerHTML = `
      <div class="drop">
        <div style="font-size:34px">📂</div>
        <p>Couldn't auto-load <b>athletes.json</b>.<br>Pick the file manually to continue.</p>
        <label for="fileInput">Choose athletes.json</label>
      </div>`;
  }

  $("#openFileBtn").addEventListener("click", () => $("#fileInput").click());
  $("#fileInput").addEventListener("change", (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        DATA = JSON.parse(r.result);
        LAST_LOADED_AT = Date.now();
        boot();
        setStatus(`Loaded ${DATA.length} entries (local file)`, "stale");
      } catch {
        setStatus("Invalid JSON file", "err");
      }
    };
    r.readAsText(f);
  });

  $("#refreshBtn").addEventListener("click", () => {
    if (LAST_LOADED_AT && DATA.length) {
      // soft refresh — no network, just re-render
      boot();
      setStatus(`Refreshed · ${relTime(LAST_LOADED_AT)}`);
    } else {
      loadData();
    }
  });

  /* ---------------- boot ---------------- */
  function boot() {
    buildMedalChips();
    buildSportChips();
    buildStats();
    render();
  }

  function buildMedalChips() {
    const opts = [
      { k:"all",    label:"All medals" },
      { k:"gold",   label:"🥇 Gold",   color:"var(--gold)"   },
      { k:"silver", label:"🥈 Silver", color:"var(--silver)" },
      { k:"bronze", label:"🥉 Bronze", color:"var(--bronze)" }
    ];
    medalEl.innerHTML = opts.map(o => `
      <button class="chip ${state.medal === o.k ? "on" : ""}" data-medal="${o.k}">
        ${o.color ? `<i class="dot" style="background:${o.color}"></i>` : ""}${o.label}
      </button>`).join("");
    medalEl.querySelectorAll("[data-medal]").forEach(b => {
      b.addEventListener("click", () => {
        state.medal = b.dataset.medal;
        medalEl.querySelectorAll(".chip").forEach(c =>
          c.classList.toggle("on", c.dataset.medal === state.medal));
        render();
      });
    });
  }

  function buildSportChips() {
    const sports = [...new Set(DATA.map(a => a.disc_desc).filter(Boolean))].sort();
    sportEl.innerHTML =
      `<button class="chip ${state.sport === "all" ? "on" : ""}" data-sport="all">All sports</button>` +
      sports.map(s => `<button class="chip ${state.sport === s ? "on" : ""}" data-sport="${esc(s)}">${esc(s)}</button>`).join("");
    sportEl.querySelectorAll("[data-sport]").forEach(b => {
      b.addEventListener("click", () => {
        state.sport = b.dataset.sport;
        sportEl.querySelectorAll(".chip").forEach(c =>
          c.classList.toggle("on", c.dataset.sport === state.sport));
        render();
      });
    });
  }

  function buildStats() {
    const seen = new Set();
    const count = { gold:0, silver:0, bronze:0 };
    DATA.forEach(a => (a.medals || []).forEach(m => {
      const key = m.medal + "|" + m.event;
      if (!seen.has(key) && count[m.medal] !== undefined) {
        seen.add(key); count[m.medal]++;
      }
    }));
    statsEl.innerHTML = `
      <div class="stat"><b>${DATA.length}</b><span>Entries</span></div>
      <div class="stat g"><b>${count.gold}</b><span>Gold</span></div>
      <div class="stat s"><b>${count.silver}</b><span>Silver</span></div>
      <div class="stat br"><b>${count.bronze}</b><span>Bronze</span></div>`;
  }

  /* ---------------- filtering ---------------- */
  function haystack(a) {
    const bio = a.bio_data || {};
    const parts = [
      a.name, a.disc_desc, a.disc, a.org_desc, a.reg,
      ...(a.medals || []).map(m => m.event),
    ];
    // add bio participant fields if present
    const p = bio.participant || bio.Participant || bio;
    if (p && typeof p === "object") {
      parts.push(p.Name, p.BirthDateRaw, p.IFId, p.Org, p.OrgDesc);
    }
    // entries
    const entries = bio.entries || bio.Entries || [];
    if (Array.isArray(entries)) {
      entries.forEach(e => parts.push(e.Desc, e.EventDesc, e.Event));
    }
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return DATA.filter(a => {
      if (state.sport !== "all" && a.disc_desc !== state.sport) return false;
      if (state.medal !== "all") {
        if (!(a.medals || []).some(m => m.medal === state.medal)) return false;
      }
      if (q && !haystack(a).includes(q)) return false;
      return true;
    });
  }

  /* ---------------- list rendering ---------------- */
  function render() {
    const rows = filtered();

    if (!rows.length) {
      listEl.innerHTML = `<div class="empty"><div class="big">🔍</div>No athletes match your filters.</div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    rows.forEach((a, i) => {
      const el = document.createElement("article");
      el.className = "card";
      el.style.animationDelay = Math.min(i * 22, 300) + "ms";
      el.dataset.reg = a.reg;

      const pills = (a.medals || []).map(m => {
        const info = medalInfo(m.medal);
        return `<span class="pill ${info.cls}">${info.icon} ${esc(m.event)}</span>`;
      }).join("");

      el.innerHTML = `
        <div class="avatar">
          <span>${esc(initials(a.name))}</span>
          ${a.photo_url ? `<img src="${esc(a.photo_url)}" alt="" loading="lazy"
              onerror="this.remove()">` : ""}
        </div>
        <div class="info">
          <h3>${esc(a.name)}</h3>
          <p class="sub">${esc(a.disc_desc)} · ${esc(a.org_desc)}</p>
          ${pills ? `<div class="pills">${pills}</div>` : ""}
        </div>
        <span class="chev">›</span>`;

      el.addEventListener("click", () => openDetail(a.reg));
      frag.appendChild(el);
    });

    listEl.innerHTML = "";
    listEl.appendChild(frag);
  }

  /* ---------------- search ---------------- */
  qInput.addEventListener("input", () => {
    state.q = qInput.value;
    searchWrap.classList.toggle("has-value", !!state.q);
    render();
  });
  $("#clearBtn").addEventListener("click", () => {
    qInput.value = ""; state.q = "";
    searchWrap.classList.remove("has-value");
    render(); qInput.focus();
  });

  /* ---------------- detail sheet ---------------- */
  function getParticipant(a) {
    const bio = a.bio_data;
    if (!bio) return {};
    // support a few possible shapes
    return bio.participant || bio.Participant || bio.profile || bio.Profile || bio;
  }

  function getEntries(a) {
    const bio = a.bio_data;
    if (!bio) return [];
    const e = bio.entries || bio.Entries || bio.events || bio.Events;
    return Array.isArray(e) ? e : [];
  }

  function getSchedule(a) {
    const bio = a.bio_data;
    if (!bio) return [];
    const s = bio.schedule || bio.Schedule || bio.results || bio.Results;
    return Array.isArray(s) ? s : [];
  }

  function getMembers(a) {
    const p = getParticipant(a);
    const m = p.Members || p.members || a.members;
    return Array.isArray(m) ? m : [];
  }

  function findResult(item, a) {
    if (Array.isArray(item.Results)) {
      const r = item.Results.find(x => x.Reg === a.reg || x.Reg === a.reg);
      if (r) return { result:r.Result, rank:r.RkPo, medal:codeToMedal(r.Medal) };
    }
    const sides = [item.Home, item.Away].filter(Boolean);
    for (const s of sides) {
      if (s.Reg && s.Reg === a.reg) {
        const other = sides.find(o => o !== s);
        const rank = s.Winner ? 1 : (other && other.Winner ? 2 : null);
        return { result: s.Result, rank, medal: codeToMedal(s.Medal) };
      }
    }
    return null;
  }

  function openDetail(reg) {
    const a = DATA.find(x => x.reg === reg);
    if (!a) return;

    const p = getParticipant(a);
    const entries = getEntries(a);
    const schedule = getSchedule(a).slice().sort(
      (x, y) => new Date(x.DateTimeRaw || x.DateRaw || 0) - new Date(y.DateTimeRaw || y.DateRaw || 0)
    );
    const members = getMembers(a);

    const heroPills = (a.medals || []).map(m => {
      const info = medalInfo(m.medal);
      return `<span class="pill ${info.cls}">${info.icon} ${esc(m.event)}</span>`;
    }).join("");

    let html = `
      <div class="hero">
        <div class="avatar">
          <span>${esc(initials(a.name))}</span>
          ${a.photo_url ? `<img src="${esc(a.photo_url)}" alt="" onerror="this.remove()">` : ""}
        </div>
        <div style="min-width:0">
          <h2>${esc(a.name)}</h2>
          <div class="meta">${esc(a.disc_desc)} · ${esc(a.org_desc)}</div>
          ${heroPills ? `<div class="pills" style="margin-top:7px">${heroPills}</div>` : ""}
        </div>
      </div>`;

    /* bio — only render if we actually have bio_data */
    if (a.bio_data && Object.keys(p).length) {
      const kv = [
        ["Reg", p.Reg || a.reg],
        ["Gender", p.Gender === "M" ? "Male" : p.Gender === "W" ? "Female" : p.Gender === "X" ? "Mixed" : "—"],
        ["Date of birth", p.BirthDateRaw || p.BirthDate || "—"],
        ["Type", p.Type === "T" ? "Team" : p.Type === "D" ? "Doubles pair" : "Athlete"],
        ["IF Id", p.IFId || "—"],
        ["Weight", p.Weight ? p.Weight + " kg" : "—"],
        ["Height", p.Height ? p.Height + " cm" : "—"],
        ["Sport code", a.disc || "—"]
      ];
      html += `<div class="sec"><h4>Profile</h4><div class="grid">
        ${kv.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}
      </div></div>`;
    }

    /* team members */
    if (members.length) {
      html += `<div class="sec"><h4>Squad (${members.length})</h4>
        ${members.map(m => `
          <div class="member">
            <div>${esc(m.Name || m.name)}</div>
            <span>${esc(m.PosDesc || (m.Bib ? "#" + m.Bib : ""))}</span>
          </div>`).join("")}
      </div>`;
    }

    /* entries */
    if (entries.length) {
      html += `<div class="sec"><h4>Entries</h4>${entries.map(e => {
        const info = medalInfo(codeToMedal(e.Medal));
        const bits = [];
        if (e.Rank) bits.push("Rank " + e.Rank);
        if (e.Result) bits.push("Result " + e.Result);
        return `<div class="item">
          <div class="grow">
            <div class="t">${esc(e.Desc || e.EventDesc || e.Event || "")}</div>
            ${bits.length ? `<div class="d">${esc(bits.join(" · "))}</div>` : ""}
          </div>
          ${e.Medal ? `<span class="pill ${info.cls}">${info.icon}</span>` : ""}
        </div>`;
      }).join("")}</div>`;
    }

    /* schedule / timeline */
    if (schedule.length) {
      html += `<div class="sec"><h4>Schedule &amp; Results</h4>`;
      schedule.forEach(item => {
        const r = findResult(item, a);
        const info = r && r.medal ? medalInfo(r.medal) : null;
        const resBits = [];
        if (r) {
          if (r.result) resBits.push(esc(r.result));
          if (r.rank) resBits.push("Rank " + esc(r.rank));
        }
        const dateRaw = item.DateTimeRaw || item.DateRaw;
        html += `<div class="tl">
          <div class="date">${esc(fmtDate(dateRaw))}</div>
          <div class="title">${esc(item.EventDesc || item.Event || "")} — ${esc(item.PhaseDescA || item.PhaseDesc || "")}</div>
          <div class="venue">${esc(item.VenueDesc || "")}${item.LocDesc ? " · " + esc(item.LocDesc) : ""}</div>
          ${resBits.length ? `<div class="res">${info ? info.icon + " " : ""}${resBits.join(" · ")}</div>` : ""}
        </div>`;
      });
      html += `</div>`;
    }

    /* fallback — show raw bio when nothing was recognized */
    if (a.bio_data && !Object.keys(p).length && !entries.length && !schedule.length) {
      html += `<div class="sec"><h4>Raw bio data</h4>
        <div class="raw">${esc(JSON.stringify(a.bio_data, null, 2))}</div>
      </div>`;
    }

    /* empty bio note */
    if (!a.bio_data) {
      html += `<div class="sec"><h4>Bio</h4>
        <div class="item"><div class="grow">
          <div class="t">No bio data available</div>
          <div class="d">This entry doesn't have bio info yet.</div>
        </div></div></div>`;
    }

    sheetBody.innerHTML = html;
    sheetBody.scrollTop = 0;
    sheet.classList.add("show");
    backdrop.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeSheet() {
    sheet.classList.remove("show");
    backdrop.classList.remove("show");
    document.body.style.overflow = "";
  }
  $("#closeSheet").addEventListener("click", closeSheet);
  backdrop.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  /* swipe-down to close */
  (() => {
    let startY = 0, curY = 0, dragging = false;
    sheet.addEventListener("touchstart", (e) => {
      if (sheetBody.scrollTop > 2) return;
      startY = e.touches[0].clientY; dragging = true; sheet.style.transition = "none";
    }, { passive:true });
    sheet.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      curY = e.touches[0].clientY;
      const dy = Math.max(0, curY - startY);
      sheet.style.transform = `translateY(${dy}px)`;
    }, { passive:true });
    sheet.addEventListener("touchend", () => {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (curY - startY > 110) closeSheet();
      startY = curY = 0;
    });
  })();

  /* ---------------- auto refresh ---------------- */
  setInterval(() => {
    refreshStatus();
  }, 30 * 1000);   // update "x min ago" label every 30s

  setInterval(() => {
    loadData();
  }, AUTO_REFRESH_MS);

  /* ---------------- start ---------------- */
  loadData();
})();
</script>
</body>
</html>
