<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070f" />
<title>Asian Games 2026 — India Medalists</title>
<meta name="description" content="Live medal tracker for India at Asian Games 2026 — every athlete, every medal." />
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --bg-0:#05070f;
    --bg-1:#0a0f1e;
    --bg-2:#0f1530;
    --card:#141a2f;
    --card-2:#1a2340;
    --glass:rgba(255,255,255,.04);
    --glass-hi:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.08);
    --line-hi:rgba(255,255,255,.14);
    --text:#eef2fb;
    --muted:#8b97b8;
    --muted-2:#5c688a;
    --accent:#5b8cff;
    --accent-2:#8a5bff;
    --gold:#ffcf4d;
    --gold-2:#ffa726;
    --silver:#cdd6e8;
    --bronze:#e39a5a;
    --green:#3ddc84;
    --red:#ff5c7a;
    --radius:20px;
    --radius-sm:14px;
    --shadow:0 20px 60px rgba(0,0,0,.5);
    --shadow-sm:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-feature-settings:"cv02","cv03","cv04","cv11";
    color:var(--text);
    background:var(--bg-0);
    min-height:100%;
    padding-bottom:60px;
    overflow-x:hidden;
  }
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  ::selection{background:rgba(91,140,255,.35)}

  /* ============================================================
     BACKGROUND
     ============================================================ */
  .bg-layer{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(91,140,255,.22), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(138,91,255,.18), transparent 55%),
      radial-gradient(700px 500px at 50% 110%, rgba(255,207,77,.06), transparent 60%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0) 60%);
  }
  .bg-layer::after{
    content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.6;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .topbar{
    position:sticky;top:0;z-index:40;
    padding:14px 16px 12px;
    background:rgba(5,7,15,.72);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .brand-row{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;border-radius:14px;flex:0 0 auto;
    display:grid;place-items:center;position:relative;
    font-weight:800;font-size:14px;letter-spacing:.5px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 26px rgba(91,140,255,.42), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .logo::after{
    content:"";position:absolute;inset:1px;border-radius:13px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 45%);
  }
  .brand-text h1{
    font-size:16.5px;margin:0;font-weight:800;letter-spacing:-.2px;
    background:linear-gradient(180deg,#fff,#c9d4f5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-text p{margin:2px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.2px}
  .live-badge{
    margin-left:auto;display:flex;align-items:center;gap:6px;
    padding:7px 11px;border-radius:999px;
    background:rgba(255,92,122,.1);
    border:1px solid rgba(255,92,122,.28);
    font-size:11px;font-weight:800;letter-spacing:.8px;color:#ff8fa3;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:var(--red);
    box-shadow:0 0 10px var(--red);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(.85)}
  }
  .live-badge.stale{background:rgba(255,184,77,.1);border-color:rgba(255,184,77,.28);color:#ffcf7a}
  .live-badge.stale .live-dot{background:#ffb84d;box-shadow:0 0 10px #ffb84d}
  .live-badge.err{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.28);color:#ff8fa3}
  .live-badge.err .live-dot{background:var(--red);box-shadow:0 0 10px var(--red)}

  .search{position:relative;display:block;margin-top:12px}
  .search svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;opacity:.6;pointer-events:none;color:var(--muted);
  }
  .search input{
    width:100%;padding:13px 42px 13px 40px;
    background:var(--glass);border:1px solid var(--line);
    border-radius:var(--radius-sm);color:var(--text);font-size:14px;
    outline:none;transition:border-color .2s, background .2s, box-shadow .2s;
    font-family:inherit;
  }
  .search input::placeholder{color:var(--muted-2)}
  .search input:focus{
    border-color:rgba(91,140,255,.55);
    background:rgba(91,140,255,.06);
    box-shadow:0 0 0 3px rgba(91,140,255,.14);
  }
  .search .clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:18px;
    width:30px;height:30px;border-radius:50%;display:none;
    transition:background .15s;
  }
  .search .clear:hover{background:var(--glass-hi)}
  .search.has-value .clear{display:block}

  /* ============================================================
     HERO
     ============================================================ */
  .hero{padding:20px 16px 8px}
  .hero-inner{
    position:relative;overflow:hidden;
    padding:20px 18px 22px;border-radius:22px;
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(255,207,77,.1), transparent 55%),
      linear-gradient(160deg,var(--card),var(--card-2));
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
  }
  .hero-inner::before{
    content:"";position:absolute;top:-40%;right:-20%;width:300px;height:300px;
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,207,77,.18), transparent);
    pointer-events:none;
  }
  .hero-kicker{
    font-size:11px;font-weight:800;letter-spacing:1.6px;
    color:var(--muted);text-transform:uppercase;margin-bottom:8px;
  }
  .hero-title{
    font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1;
    background:linear-gradient(135deg,#fff 30%, #ffd98a 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:4px;
  }
  .hero-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}

  .medal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .medal-box{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    padding:12px 12px 11px;border-radius:14px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .medal-box .tier{
    display:flex;align-items:center;gap:6px;
    font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  }
  .medal-box .tier i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .medal-box b{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1;color:#fff}
  .medal-box.gold .tier{color:var(--gold)} .medal-box.gold .tier i{background:var(--gold);box-shadow:0 0 10px rgba(255,207,77,.5)}
  .medal-box.silver .tier{color:var(--silver)} .medal-box.silver .tier i{background:var(--silver);box-shadow:0 0 10px rgba(205,214,232,.4)}
  .medal-box.bronze .tier{color:var(--bronze)} .medal-box.bronze .tier i{background:var(--bronze);box-shadow:0 0 10px rgba(227,154,90,.4)}
  .medal-box::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;opacity:.35}
  .medal-box.gold::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .medal-box.silver::after{background:linear-gradient(90deg,var(--silver),transparent)}
  .medal-box.bronze::after{background:linear-gradient(90deg,var(--bronze),transparent)}

  /* ============================================================
     SPOTLIGHT
     ============================================================ */
  .spotlight{padding:14px 0 6px}
  .sec-label{
    padding:0 16px;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
    font-size:11px;font-weight:800;letter-spacing:1.4px;
    color:var(--muted);text-transform:uppercase;
  }
  .sec-label .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .spot-scroll{
    display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .spot-scroll::-webkit-scrollbar{display:none}
  .spot-card{
    flex:0 0 auto;width:170px;position:relative;overflow:hidden;
    border-radius:18px;padding:12px;
    background:linear-gradient(165deg,var(--card),var(--card-2));
    border:1px solid var(--line);
    cursor:pointer;transition:transform .2s, border-color .2s;
  }
  .spot-card:active{transform:scale(.97)}
  .spot-card.rank-1{
    border-color:rgba(255,207,77,.4);
    box-shadow:0 12px 30px rgba(255,207,77,.12), inset 0 0 0 1px rgba(255,207,77,.08);
  }
  .spot-photo{
    width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;
    background:linear-gradient(135deg,#2a3557,#1b2340);
    display:grid;place-items:center;
    font-size:28px;font-weight:900;color:#7f8fb8;position:relative;
    margin-bottom:10px;
  }
  .spot-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .spot-medal-tag{
    position:absolute;top:8px;right:8px;
    padding:3px 8px;border-radius:999px;
    font-size:10px;font-weight:900;letter-spacing:.5px;
    background:rgba(5,7,15,.75);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.15);color:var(--gold);
  }
  .spot-name{
    font-size:12.5px;font-weight:800;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
    margin:0 0 3px;
  }
  .spot-meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spot-pills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .spot-pills .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .spot-pills .dot.gold{background:var(--gold)}
  .spot-pills .dot.silver{background:var(--silver)}
  .spot-pills .dot.bronze{background:var(--bronze)}

  /* ============================================================
     FILTERS
     ============================================================ */
  .filters{padding:6px 0 0}
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:8px 16px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 14px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);
    color:var(--muted);font-size:12.5px;font-weight:700;
    white-space:nowrap;transition:all .18s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{background:var(--glass-hi);color:var(--text)}
  .chip:active{transform:scale(.96)}
  .chip.on{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;border-color:transparent;
    box-shadow:0 6px 18px rgba(91,140,255,.32);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .chip.on .dot{box-shadow:0 0 8px rgba(255,255,255,.5)}

  /* ============================================================
     LIST
     ============================================================ */
  main{padding:6px 16px 60px;display:flex;flex-direction:column;gap:10px}
  .count-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 18px 4px;
    font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;
  }
  .count-row b{color:var(--text)}

  .card{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(160deg,var(--card),var(--card-2));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .18s, border-color .18s, box-shadow .18s;
    animation:rise .4s cubic-bezier(.2,.7,.3,1) backwards;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 120% at 0% 50%, rgba(91,140,255,.08), transparent 70%);
    opacity:0;transition:opacity .25s;
  }
  .card:hover{border-color:var(--line-hi);box-shadow:var(--shadow-sm)}
  .card:hover::before{opacity:1}
  .card:active{transform:scale(.985)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .avatar{
    position:relative;width:58px;height:58px;flex:0 0 auto;
    border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,#2a3557,#1b2340);
    display:grid;place-items:center;
    font-weight:800;font-size:15px;color:#93a3cc;letter-spacing:.5px;
    border:1px solid var(--line);
  }
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .avatar .medal-count{
    position:absolute;bottom:-2px;right:-2px;
    min-width:22px;height:22px;padding:0 6px;border-radius:999px;
    display:grid;place-items:center;
    font-size:10.5px;font-weight:900;color:#05070f;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    border:2px solid var(--card);
    box-shadow:0 4px 12px rgba(255,207,77,.35);
  }

  .info{min-width:0;flex:1}
  .info h3{
    margin:0 0 3px;font-size:14.5px;font-weight:800;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;
    letter-spacing:-.1px;
  }
  .info .sub{
    margin:0;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:6px;
  }
  .info .sub .sep{color:var(--muted-2)}
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pill{
    font-size:10.5px;font-weight:800;padding:3.5px 9px;border-radius:999px;
    border:1px solid transparent;white-space:nowrap;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;
    display:inline-flex;align-items:center;gap:4px;
    letter-spacing:.1px;
  }
  .pill.gold{background:rgba(255,207,77,.12);color:var(--gold);border-color:rgba(255,207,77,.28)}
  .pill.silver{background:rgba(205,214,232,.1);color:var(--silver);border-color:rgba(205,214,232,.24)}
  .pill.bronze{background:rgba(227,154,90,.12);color:var(--bronze);border-color:rgba(227,154,90,.28)}
  .chev{color:var(--muted-2);font-size:20px;line-height:1;flex:0 0 auto;transition:transform .2s}
  .card:hover .chev{transform:translateX(2px);color:var(--muted)}

  /* ============================================================
     EMPTY / LOADING
     ============================================================ */
  .empty{
    text-align:center;color:var(--muted);padding:70px 24px;font-size:14px;
  }
  .empty .big{font-size:44px;margin-bottom:14px;opacity:.6}
  .empty h3{color:var(--text);font-size:16px;font-weight:800;margin:0 0 6px}

  .skeleton{
    height:86px;border-radius:var(--radius);
    background:linear-gradient(90deg,#141a2f 0%,#1a2340 50%,#141a2f 100%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
    border:1px solid var(--line);
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ============================================================
     SHEET
     ============================================================ */
  .backdrop{
    position:fixed;inset:0;background:rgba(3,5,12,.7);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:60;opacity:0;pointer-events:none;transition:opacity .28s;
  }
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:70;
    max-width:680px;margin:0 auto;
    background:linear-gradient(180deg,#141c33,#0c1122);
    border-radius:26px 26px 0 0;
    border:1px solid var(--line-hi);border-bottom:0;
    max-height:92dvh;display:flex;flex-direction:column;
    transform:translateY(102%);
    transition:transform .38s cubic-bezier(.22,.9,.28,1);
    box-shadow:0 -30px 60px rgba(0,0,0,.6);
  }
  .sheet.show{transform:translateY(0)}
  .grab{width:44px;height:4px;border-radius:99px;background:#39445f;margin:10px auto 0;flex:0 0 auto}
  .sheet-body{overflow-y:auto;padding:14px 20px 40px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  .hero-card{
    display:flex;gap:16px;align-items:center;
    padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:4px;
  }
  .hero-card .avatar{width:80px;height:80px;border-radius:22px;font-size:22px}
  .hero-card h2{margin:0 0 4px;font-size:19px;line-height:1.2;font-weight:900;letter-spacing:-.3px}
  .hero-card .meta{font-size:12.5px;color:var(--muted)}

  .sec{margin-top:22px}
  .sec h4{
    margin:0 0 10px;font-size:11px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--muted);font-weight:800;
    display:flex;align-items:center;gap:8px;
  }
  .sec h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kv{
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;min-width:0;
  }
  .kv span{
    display:block;font-size:9.5px;color:var(--muted);
    letter-spacing:.7px;text-transform:uppercase;font-weight:700;margin-bottom:3px;
  }
  .kv b{display:block;font-size:13.5px;font-weight:700;word-break:break-word}

  .item{
    display:flex;gap:12px;align-items:center;
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .item .grow{flex:1;min-width:0}
  .item .t{font-size:13.5px;font-weight:700;line-height:1.35}
  .item .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}

  .tl{position:relative;padding-left:22px;margin-bottom:14px}
  .tl::before{
    content:"";position:absolute;left:6px;top:8px;bottom:-8px;width:1.5px;
    background:linear-gradient(180deg,var(--accent),transparent 90%);opacity:.5;
  }
  .tl:last-child::before{display:none}
  .tl::after{
    content:"";position:absolute;left:0;top:5px;width:13px;height:13px;border-radius:50%;
    background:var(--bg-0);border:2.5px solid var(--accent);
    box-shadow:0 0 10px rgba(91,140,255,.45);
  }
  .tl .date{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.4px}
  .tl .title{font-size:13.5px;font-weight:700;margin:4px 0 2px;line-height:1.35}
  .tl .venue{font-size:11.5px;color:var(--muted)}
  .tl .res{
    display:inline-flex;align-items:center;gap:7px;margin-top:8px;
    font-size:12px;font-weight:800;padding:5px 11px;border-radius:10px;
    background:rgba(91,140,255,.12);color:#a9c1ff;
    border:1px solid rgba(91,140,255,.24);
  }

  .member{
    display:flex;justify-content:space-between;gap:8px;
    font-size:13px;padding:9px 0;
    border-bottom:1px dashed rgba(255,255,255,.06);
  }
  .member:last-child{border-bottom:0}
  .member span{color:var(--muted);font-size:11.5px}

  .close-x{
    position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid var(--line-hi);
    display:grid;place-items:center;font-size:17px;color:var(--muted);z-index:2;
    transition:background .18s, transform .18s;
  }
  .close-x:hover{background:rgba(255,255,255,.1);transform:rotate(90deg)}

  .raw{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10.5px;color:var(--muted);line-height:1.55;
    background:rgba(0,0,0,.3);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;max-height:240px;overflow:auto;
    white-space:pre-wrap;word-break:break-word;
  }

  footer{
    text-align:center;padding:24px 20px 40px;
    font-size:11px;color:var(--muted-2);line-height:1.6;
  }

  @media (min-width:640px){
    .hero-title{font-size:44px}
    main{padding-left:24px;padding-right:24px}
    .topbar{padding-left:24px;padding-right:24px}
    .hero{padding-left:24px;padding-right:24px}
    .sec-label{padding-left:24px;padding-right:24px}
    .spot-scroll{padding-left:24px;padding-right:24px}
    .chips{padding-left:24px;padding-right:24px}
    .count-row{padding-left:24px;padding-right:24px}
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<header class="topbar">
  <div class="brand-row">
    <div class="logo">AG</div>
    <div class="brand-text">
      <h1>Asian Games 2026</h1>
      <p>India · Medalist Tracker</p>
    </div>
    <div class="live-badge" id="liveBadge">
      <span class="live-dot"></span>
      <span id="liveLabel">LIVE</span>
    </div>
  </div>

  <label class="search" id="searchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" placeholder="Search athlete, sport or event…" autocomplete="off" />
    <button class="clear" id="clearBtn" aria-label="Clear">×</button>
  </label>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-kicker">Total medals won</div>
    <div class="hero-title" id="heroTotal">0</div>
    <div class="hero-sub" id="heroSub">Loading live data…</div>

    <div class="medal-row">
      <div class="medal-box gold">
        <div class="tier"><i></i>Gold</div>
        <b id="statGold">0</b>
      </div>
      <div class="medal-box silver">
        <div class="tier"><i></i>Silver</div>
        <b id="statSilver">0</b>
      </div>
      <div class="medal-box bronze">
        <div class="tier"><i></i>Bronze</div>
        <b id="statBronze">0</b>
      </div>
    </div>
  </div>
</section>

<section class="spotlight" id="spotlightSec" hidden>
  <div class="sec-label"><span>🏆</span> Top medalists <span class="line"></span></div>
  <div class="spot-scroll" id="spotScroll"></div>
</section>

<section class="filters">
  <div class="chips" id="medalChips"></div>
  <div class="chips" id="sportChips"></div>
</section>

<div class="count-row" id="countRow" hidden>
  <span><b id="countNum">0</b> athletes</span>
  <span id="countFilter"></span>
</div>
<main id="list"></main>

<footer>
  <div>Unofficial fan tracker · Data from Olympic Council of Asia</div>
  <div style="margin-top:6px"><span id="footerUpdated">Synced —</span></div>
</footer>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close-x" id="closeSheet" aria-label="Close">×</button>
  <div class="grab"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<script>
(() => {
  "use strict";

  const DATA_SOURCES = [
    "data/athletes.json",
    "athletes.json",
  ];
  const AUTO_REFRESH_MS = 5 * 60 * 1000;
  const STALE_MS        = 75 * 60 * 1000;

  let DATA = [];
  let LAST_LOADED_AT = null;
  const state = { q: "", medal: "all", sport: "all" };

  const $ = (s) => document.querySelector(s);
  const listEl      = $("#list");
  const medalEl     = $("#medalChips");
  const sportEl     = $("#sportChips");
  const sheet       = $("#sheet");
  const sheetBody   = $("#sheetBody");
  const backdrop    = $("#backdrop");
  const searchWrap  = $("#searchWrap");
  const qInput      = $("#q");
  const liveBadge   = $("#liveBadge");
  const liveLabel   = $("#liveLabel");
  const countRow    = $("#countRow");
  const countNum    = $("#countNum");
  const countFilter = $("#countFilter");
  const spotSec     = $("#spotlightSec");
  const spotScroll  = $("#spotScroll");

  /* ---------------- helpers ---------------- */
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
    (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  const MEDALS = {
    gold:   { cls:"gold",   icon:"🥇", label:"Gold"   },
    silver: { cls:"silver", icon:"🥈", label:"Silver" },
    bronze: { cls:"bronze", icon:"🥉", label:"Bronze" }
  };
  const medalInfo = (m) => MEDALS[m] || { cls:"", icon:"🏅", label:m || "" };

  const codeToMedal = (code) => {
    if (!code) return null;
    const c = String(code).toUpperCase();
    if (c.includes("GOLD"))   return "gold";
    if (c.includes("SILVER")) return "silver";
    if (c.includes("BRONZE")) return "bronze";
    return null;
  };

  const initials = (name) =>
    String(name || "?").trim().split(/\s+/).slice(0, 2)
      .map(w => w[0]).join("").toUpperCase();

  const fmtDate = (raw) => {
    if (!raw) return "";
    const d = new Date(raw);
    if (isNaN(d)) return "";
    return d.toLocaleString(undefined, {
      day:"2-digit", month:"short", year:"numeric",
      hour:"2-digit", minute:"2-digit"
    });
  };

  const relTime = (ts) => {
    if (!ts) return "";
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60)    return s + "s ago";
    if (s < 3600)  return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return Math.floor(s / 86400) + " d ago";
  };

  /* ---------------- helpers to read bio ---------------- */
  function getParticipant(a) {
    const b = a.bio_data;
    if (!b) return {};
    return b.participant || b.Participant || b.profile || b.Profile || b;
  }
  function getEntries(a) {
    const b = a.bio_data;
    if (!b) return [];
    const e = b.entries || b.Entries || b.events || b.Events;
    return Array.isArray(e) ? e : [];
  }
  function getSchedule(a) {
    const b = a.bio_data;
    if (!b) return [];
    const s = b.schedule || b.Schedule || b.results || b.Results;
    return Array.isArray(s) ? s : [];
  }
  function getMembers(a) {
    const p = getParticipant(a);
    const m = p.Members || p.members || a.members;
    return Array.isArray(m) ? m : [];
  }

  /* ============================================================
     ★ KEY CHANGE ★
     Treat teams / pairs as their individual people.
     The JSON already contains an individual entry for each team
     member (cricket, kabaddi, badminton, relay, doubles etc),
     so we only need to drop the aggregate team / pair records.
     ============================================================ */
  function isAggregateTeam(a) {
    const p = getParticipant(a);
    if (p && (p.hasMembers === true || p.Type === "T" || p.Type === "D")) return true;
    // fallback: entries whose reg looks like a team code
    return /^[A-Z]{3}[A-Z0-9]*TEAM/i.test(a.reg || "") ||
           /DOUBLES/i.test(a.reg || "") ||
           /SCULL\d/i.test(a.reg || "");
  }

  /* ---------------- live badge ---------------- */
  function updateLive() {
    if (!LAST_LOADED_AT) {
      liveBadge.classList.add("stale");
      liveLabel.textContent = "SYNCING";
      return;
    }
    const age = Date.now() - LAST_LOADED_AT;
    liveBadge.classList.remove("err");
    if (age > STALE_MS) {
      liveBadge.classList.add("stale");
      liveLabel.textContent = "STALE";
    } else {
      liveBadge.classList.remove("stale");
      liveLabel.textContent = "LIVE";
    }
    $("#footerUpdated").textContent = "Synced " + relTime(LAST_LOADED_AT);
  }

  /* ---------------- data loading ---------------- */
  async function loadData() {
    liveBadge.classList.add("stale");
    liveLabel.textContent = "SYNCING";

    for (const url of DATA_SOURCES) {
      try {
        const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) continue;
        const raw = await res.json();
        if (!Array.isArray(raw)) throw new Error("Not an array");

        // ★ Split teams/pairs into their individual athletes ★
        DATA = raw.filter(a => !isAggregateTeam(a));

        LAST_LOADED_AT = Date.now();
        boot();
        updateLive();
        return;
      } catch (e) { /* try next */ }
    }
    liveBadge.classList.add("err");
    liveLabel.textContent = "OFFLINE";
    listEl.innerHTML = `
      <div class="empty">
        <div class="big">📡</div>
        <h3>Couldn't load data</h3>
        <div>athletes.json is unreachable. It updates hourly via GitHub Actions.</div>
      </div>`;
  }

  /* ---------------- boot ---------------- */
  function boot() {
    renderHero();
    renderSpotlight();
    buildMedalChips();
    buildSportChips();
    render();
  }

  /* ---------------- hero ---------------- */
  function renderHero() {
    // Count unique Indian medal events (so teams count once)
    const seen = new Set();
    const count = { gold:0, silver:0, bronze:0 };
    DATA.forEach(a => (a.medals || []).forEach(m => {
      const key = m.medal + "|" + m.event;
      if (!seen.has(key) && count[m.medal] !== undefined) {
        seen.add(key); count[m.medal]++;
      }
    }));
    const total = count.gold + count.silver + count.bronze;

    animateNumber($("#heroTotal"),  total,         900);
    animateNumber($("#statGold"),   count.gold,    800);
    animateNumber($("#statSilver"), count.silver,  800);
    animateNumber($("#statBronze"), count.bronze,  800);

    $("#heroSub").textContent =
      `${DATA.length} individual athletes & medalists tracked · India at Asian Games 2026`;
  }

  function animateNumber(el, to, duration) {
    const from = parseInt(el.textContent.replace(/\D/g, ""), 10) || 0;
    if (from === to) { el.textContent = to; return; }
    const start = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      el.textContent = Math.round(from + (to - from) * ease(t));
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = to;
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- spotlight ---------------- */
  function renderSpotlight() {
    const scored = DATA
      .filter(a => a.photo_url && Array.isArray(a.medals) && a.medals.length)
      .map(a => {
        const counts = { gold:0, silver:0, bronze:0 };
        a.medals.forEach(m => { if (counts[m.medal] !== undefined) counts[m.medal]++; });
        const score = counts.gold*100 + counts.silver*10 + counts.bronze;
        return { a, counts, score };
      })
      .filter(x => x.a.medals.length >= 2)
      .sort((x, y) => y.score - x.score)
      .slice(0, 12);

    if (!scored.length) { spotSec.hidden = true; return; }
    spotSec.hidden = false;

    spotScroll.innerHTML = scored.map((s, i) => {
      const a = s.a;
      const dots = [
        ...Array(s.counts.gold).fill("gold"),
        ...Array(s.counts.silver).fill("silver"),
        ...Array(s.counts.bronze).fill("bronze")
      ].slice(0, 5).map(c => `<i class="dot ${c}"></i>`).join("");
      const total = a.medals.length;
      return `
        <div class="spot-card ${i === 0 ? "rank-1" : ""}" data-reg="${esc(a.reg)}">
          <div class="spot-photo">
            <span>${esc(initials(a.name))}</span>
            <img src="${esc(a.photo_url)}" alt="" loading="lazy" onerror="this.remove()">
            <div class="spot-medal-tag">${total}×</div>
          </div>
          <h4 class="spot-name">${esc(a.name)}</h4>
          <div class="spot-meta">${esc(a.disc_desc)}</div>
          <div class="spot-pills">${dots}</div>
        </div>`;
    }).join("");

    spotScroll.querySelectorAll(".spot-card").forEach(el => {
      el.addEventListener("click", () => openDetail(el.dataset.reg));
    });
  }

  /* ---------------- chips ---------------- */
  function buildMedalChips() {
    const opts = [
      { k:"all",    label:"All medals" },
      { k:"gold",   label:"Gold",   color:"var(--gold)"   },
      { k:"silver", label:"Silver", color:"var(--silver)" },
      { k:"bronze", label:"Bronze", color:"var(--bronze)" }
    ];
    medalEl.innerHTML = opts.map(o => `
      <button class="chip ${state.medal === o.k ? "on" : ""}" data-medal="${o.k}">
        ${o.color ? `<i class="dot" style="background:${o.color}"></i>` : ""}${o.label}
      </button>`).join("");
    medalEl.querySelectorAll("[data-medal]").forEach(b => {
      b.addEventListener("click", () => {
        state.medal = b.dataset.medal;
        medalEl.querySelectorAll(".chip").forEach(c =>
          c.classList.toggle("on", c.dataset.medal === state.medal));
        render();
      });
    });
  }

  function buildSportChips() {
    const sports = [...new Set(DATA.map(a => a.disc_desc).filter(Boolean))].sort();
    sportEl.innerHTML =
      `<button class="chip ${state.sport === "all" ? "on" : ""}" data-sport="all">All sports</button>` +
      sports.map(s => `<button class="chip ${state.sport === s ? "on" : ""}" data-sport="${esc(s)}">${esc(s)}</button>`).join("");
    sportEl.querySelectorAll("[data-sport]").forEach(b => {
      b.addEventListener("click", () => {
        state.sport = b.dataset.sport;
        sportEl.querySelectorAll(".chip").forEach(c =>
          c.classList.toggle("on", c.dataset.sport === state.sport));
        render();
      });
    });
  }

  /* ---------------- filtering ---------------- */
  function haystack(a) {
    const parts = [
      a.name, a.disc_desc, a.disc, a.org_desc, a.reg,
      ...(a.medals || []).map(m => m.event),
    ];
    const bio = a.bio_data;
    if (bio && typeof bio === "object") {
      const p = bio.participant || bio.Participant || bio;
      if (p && typeof p === "object") {
        parts.push(p.Name, p.BirthDateRaw, p.IFId, p.Org, p.OrgDesc);
      }
      const entries = bio.entries || bio.Entries;
      if (Array.isArray(entries)) entries.forEach(e => parts.push(e.Desc, e.EventDesc));
    }
    return parts.filter(Boolean).join(" ").toLowerCase();
  }

  function filtered() {
    const q = state.q.trim().toLowerCase();
    return DATA.filter(a => {
      if (state.sport !== "all" && a.disc_desc !== state.sport) return false;
      if (state.medal !== "all") {
        if (!(a.medals || []).some(m => m.medal === state.medal)) return false;
      }
      if (q && !haystack(a).includes(q)) return false;
      return true;
    });
  }

  /* ---------------- list render ---------------- */
  function render() {
    const rows = filtered();

    countRow.hidden = false;
    countNum.textContent = rows.length;
    const tags = [];
    if (state.medal !== "all") tags.push(state.medal);
    if (state.sport !== "all") tags.push(state.sport);
    countFilter.textContent = tags.length ? tags.join(" · ") : "";

    if (!rows.length) {
      listEl.innerHTML = `
        <div class="empty">
          <div class="big">🔍</div>
          <h3>No athletes match</h3>
          <div>Try clearing filters or search</div>
        </div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    rows.forEach((a, i) => {
      const el = document.createElement("article");
      el.className = "card";
      el.style.animationDelay = Math.min(i * 18, 320) + "ms";
      el.dataset.reg = a.reg;

      const pills = (a.medals || []).map(m => {
        const info = medalInfo(m.medal);
        return `<span class="pill ${info.cls}">${info.icon} ${esc(m.event)}</span>`;
      }).join("");

      const medalCount = (a.medals || []).length;
      const showBadge = medalCount > 1;

      el.innerHTML = `
        <div class="avatar">
          <span>${esc(initials(a.name))}</span>
          ${a.photo_url ? `<img src="${esc(a.photo_url)}" alt="" loading="lazy"
              onerror="this.remove()">` : ""}
          ${showBadge ? `<span class="medal-count">${medalCount}</span>` : ""}
        </div>
        <div class="info">
          <h3>${esc(a.name)}</h3>
          <p class="sub">
            <span>${esc(a.disc_desc)}</span>
            <span class="sep">·</span>
            <span>${esc(a.org_desc)}</span>
          </p>
          ${pills ? `<div class="pills">${pills}</div>` : ""}
        </div>
        <span class="chev">›</span>`;

      el.addEventListener("click", () => openDetail(a.reg));
      frag.appendChild(el);
    });

    listEl.innerHTML = "";
    listEl.appendChild(frag);
  }

  /* ---------------- search ---------------- */
  qInput.addEventListener("input", () => {
    state.q = qInput.value;
    searchWrap.classList.toggle("has-value", !!state.q);
    render();
  });
  $("#clearBtn").addEventListener("click", () => {
    qInput.value = ""; state.q = "";
    searchWrap.classList.remove("has-value");
    render(); qInput.focus();
  });

  /* ---------------- detail ---------------- */
  function findResult(item, a) {
    if (Array.isArray(item.Results)) {
      const r = item.Results.find(x => x.Reg === a.reg);
      if (r) return { result:r.Result, rank:r.RkPo, medal:codeToMedal(r.Medal) };
    }
    const sides = [item.Home, item.Away].filter(Boolean);
    for (const s of sides) {
      if (s.Reg && s.Reg === a.reg) {
        const other = sides.find(o => o !== s);
        const rank = s.Winner ? 1 : (other && other.Winner ? 2 : null);
        return { result: s.Result, rank, medal: codeToMedal(s.Medal) };
      }
    }
    return null;
  }

  function openDetail(reg) {
    const a = DATA.find(x => x.reg === reg);
    if (!a) return;

    const p = getParticipant(a);
    const entries = getEntries(a);
    const schedule = getSchedule(a).slice().sort(
      (x, y) => new Date(x.DateTimeRaw || x.DateRaw || 0) - new Date(y.DateTimeRaw || y.DateRaw || 0)
    );

    const heroPills = (a.medals || []).map(m => {
      const info = medalInfo(m.medal);
      return `<span class="pill ${info.cls}">${info.icon} ${esc(m.event)}</span>`;
    }).join("");

    let html = `
      <div class="hero-card">
        <div class="avatar">
          <span>${esc(initials(a.name))}</span>
          ${a.photo_url ? `<img src="${esc(a.photo_url)}" alt="" onerror="this.remove()">` : ""}
        </div>
        <div style="min-width:0">
          <h2>${esc(a.name)}</h2>
          <div class="meta">${esc(a.disc_desc)} · ${esc(a.org_desc)}</div>
          ${heroPills ? `<div class="pills" style="margin-top:8px">${heroPills}</div>` : ""}
        </div>
      </div>`;

    if (a.bio_data && Object.keys(p).length) {
      const kv = [
        
        ["Gender", p.Gender === "M" ? "Male" : p.Gender === "W" ? "Female" : p.Gender === "X" ? "Mixed" : "—"],
        ["Date of birth", p.BirthDateRaw || p.BirthDate || "—"],
        ["Type", p.Type === "T" ? "Team member" : p.Type === "D" ? "Doubles player" : "Athlete"]
      ];
      html += `<div class="sec"><h4>Profile</h4><div class="grid">
        ${kv.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}
      </div></div>`;
    }

    if (entries.length) {
      html += `<div class="sec"><h4>Entries</h4>${entries.map(e => {
        const info = medalInfo(codeToMedal(e.Medal));
        const bits = [];
        if (e.Rank) bits.push("Rank " + e.Rank);
        if (e.Result) bits.push("Result " + e.Result);
        const teamSuffix = e.TeamName && e.isMember ? ` · ${esc(e.TeamName)}` : "";
        return `<div class="item">
          <div class="grow">
            <div class="t">${esc(e.Desc || e.EventDesc || e.Event || "")}${teamSuffix}</div>
            ${bits.length ? `<div class="d">${esc(bits.join(" · "))}</div>` : ""}
          </div>
          ${e.Medal ? `<span class="pill ${info.cls}">${info.icon}</span>` : ""}
        </div>`;
      }).join("")}</div>`;
    }

    if (schedule.length) {
      html += `<div class="sec"><h4>Schedule &amp; Results</h4>`;
      schedule.forEach(item => {
        const r = findResult(item, a);
        const info = r && r.medal ? medalInfo(r.medal) : null;
        const resBits = [];
        if (r) {
          if (r.result) resBits.push(esc(r.result));
          if (r.rank) resBits.push("Rank " + esc(r.rank));
        }
        const dateRaw = item.DateTimeRaw || item.DateRaw;
        html += `<div class="tl">
          <div class="date">${esc(fmtDate(dateRaw))}</div>
          <div class="title">${esc(item.EventDesc || item.Event || "")} — ${esc(item.PhaseDescA || item.PhaseDesc || "")}</div>
          <div class="venue">${esc(item.VenueDesc || "")}${item.LocDesc ? " · " + esc(item.LocDesc) : ""}</div>
          ${resBits.length ? `<div class="res">${info ? info.icon + " " : ""}${resBits.join(" · ")}</div>` : ""}
        </div>`;
      });
      html += `</div>`;
    }

    if (a.bio_data && !Object.keys(p).length && !entries.length && !schedule.length) {
      html += `<div class="sec"><h4>Raw bio data</h4>
        <div class="raw">${esc(JSON.stringify(a.bio_data, null, 2))}</div>
      </div>`;
    }
    if (!a.bio_data) {
      html += `<div class="sec"><h4>Bio</h4>
        <div class="item"><div class="grow">
          <div class="t">No bio data available</div>
          <div class="d">This entry doesn't have bio info yet.</div>
        </div></div></div>`;
    }

    sheetBody.innerHTML = html;
    sheetBody.scrollTop = 0;
    sheet.classList.add("show");
    backdrop.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeSheet() {
    sheet.classList.remove("show");
    backdrop.classList.remove("show");
    document.body.style.overflow = "";
  }
  $("#closeSheet").addEventListener("click", closeSheet);
  backdrop.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  /* swipe-down close */
  (() => {
    let startY = 0, curY = 0, dragging = false;
    sheet.addEventListener("touchstart", (e) => {
      if (sheetBody.scrollTop > 2) return;
      startY = e.touches[0].clientY; dragging = true; sheet.style.transition = "none";
    }, { passive:true });
    sheet.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      curY = e.touches[0].clientY;
      sheet.style.transform = `translateY(${Math.max(0, curY - startY)}px)`;
    }, { passive:true });
    sheet.addEventListener("touchend", () => {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (curY - startY > 110) closeSheet();
      startY = curY = 0;
    });
  })();

  /* ---------------- loops ---------------- */
  setInterval(updateLive, 30 * 1000);
  setInterval(loadData, AUTO_REFRESH_MS);

  /* ---------------- start ---------------- */
  listEl.innerHTML = Array.from({length:5}, () => `<div class="skeleton"></div>`).join("");
  loadData();
})();
</script>
</body>
</html>
