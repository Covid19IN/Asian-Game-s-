name: Fetch Asian Games Medals

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and decode
        run: |
          python - <<'PY'
          import json, os, sys, zlib
          import requests

          URL = "https://back.results.asiangames2026.org/s/AG2026/en/ALL/medals/org/IND"
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Referer": "https://results.asiangames2026.org/",
              "Accept": "*/*",
          }
          OUT = "data/api_sample.json"

          def build_charmap():
              cmap = {}
              for b in range(256):
                  for enc in ("cp1252", "latin1"):
                      try:
                          cmap[bytes([b]).decode(enc)] = b
                          break
                      except Exception:
                          continue
              return cmap

          def candidates(resp):
              cmap = build_charmap()
              out = []
              try:
                  out.append(("charmap(resp.text)",
                              bytes(cmap.get(c, ord(c) & 0xFF) for c in resp.text)))
              except Exception:
                  pass
              for enc in ("cp1252", "latin1"):
                  try:
                      out.append((f"resp.text.encode({enc})",
                                  resp.text.encode(enc, errors="replace")))
                  except Exception:
                      pass
              out.append(("resp.content", resp.content))
              return out

          def decompress(payloads):
              for name, data in payloads:
                  for wbits in (zlib.MAX_WBITS, -zlib.MAX_WBITS, 16 + zlib.MAX_WBITS):
                      try:
                          return zlib.decompress(data, wbits), f"{name} wbits={wbits}"
                      except Exception:
                          continue
              return None, None

          r = requests.get(URL, headers=HEADERS, timeout=30)
          print("HTTP", r.status_code)
          r.raise_for_status()

          raw, used = decompress(candidates(r))
          if raw is None:
              print("Failed to decompress payload.")
              sys.exit(1)

          print(f"Decompressed via {used} ({len(raw)} bytes)")
          data = json.loads(raw.decode("utf-8"))

          os.makedirs("data", exist_ok=True)
          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print(f"Saved -> {OUT}")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api_sample.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update medals data [skip ci]" && git push
          )
