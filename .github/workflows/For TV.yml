name: Build HLS Video (TV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Cache Photo Downloads
        uses: actions/cache@v4
        with:
          path: data/video-photos
          key: video-photos-${{ hashFiles('docs/data/athletes.json') }}
          restore-keys: |
            video-photos-

      - name: Setup folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          [ -f data/athletes.json ] && cp data/athletes.json docs/data/athletes.json || true

      - name: Render + encode HLS Direct Stream
        run: |
          python -u - <<'PYEOF'
          import sys, os, math, random, shutil, subprocess, json
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ══════════════════════════════════════════════════════
          #  CONFIG — 1920×1080 HIGH DEFINITION
          # ══════════════════════════════════════════════════════
          W, H        = 1920, 1080
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          OUT_DIR     = "docs/hls"

          TEST_LIMIT  = 12
          INTRO_FRAMES   = 120    # 4.0 s
          CARD_FRAMES    = 120    # 4.0 s per athlete
          OUTRO_FRAMES   = 150    # 5.0 s

          SAFE_X = 96
          SAFE_Y = 54

          for d in [PHOTO_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          # ══════════════════════════════════════════════════════
          #  FONTS SETUP
          # ══════════════════════════════════════════════════════
          FONT_DIRS = [
              "/usr/share/fonts/truetype/roboto/hinted/",
              "/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/",
              "/usr/share/fonts/truetype/dejavu/",
          ]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = d + n
                      if os.path.exists(p): return p
              return None

          F_BLACK = _find(["Roboto-Black.ttf", "Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_BOLD  = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_MED   = _find(["Roboto-Medium.ttf", "DejaVuSans-Bold.ttf"])
          F_REG   = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])

          def font(size, w="reg"):
              size = max(8, int(size))
              path = {"black": F_BLACK, "bold": F_BOLD, "med": F_MED, "reg": F_REG}[w]
              return ImageFont.truetype(path, size) if path else ImageFont.load_default()

          # ══════════════════════════════════════════════════════
          #  THEME DEFINITIONS
          # ══════════════════════════════════════════════════════
          THEMES = {
              "espn": {
                  "name": "ESPN BROADCAST",
                  "bg_type": "espn_mesh",
                  "panel_bg": (15, 23, 42, 245),
                  "panel_border": (59, 130, 246, 200),
                  "accent": (239, 68, 68),
                  "accent_glow": (59, 130, 246),
                  "text_main": (255, 255, 255),
                  "text_muted": (148, 163, 184),
              },
              "minimal": {
                  "name": "MINIMAL PREMIUM",
                  "bg_type": "pitch_black",
                  "panel_bg": (20, 20, 20, 255),
                  "panel_border": (60, 60, 60, 255),
                  "accent": (212, 175, 55), # Fine Gold
                  "accent_glow": (180, 180, 180),
                  "text_main": (250, 250, 250),
                  "text_muted": (130, 130, 130),
              },
              "synthwave": {
                  "name": "NEON SYNTHWAVE",
                  "bg_type": "synth_grid",
                  "panel_bg": (25, 10, 40, 235),
                  "panel_border": (255, 0, 127, 220),
                  "accent": (0, 240, 255),
                  "accent_glow": (255, 0, 127),
                  "text_main": (255, 255, 255),
                  "text_muted": (200, 140, 255),
              },
              "classic": {
                  "name": "ASIAN GAMES CLASSIC",
                  "bg_type": "royal_glow",
                  "panel_bg": (10, 30, 70, 240),
                  "panel_border": (255, 215, 0, 200),
                  "accent": (255, 215, 0),
                  "accent_glow": (0, 150, 255),
                  "text_main": (255, 255, 255),
                  "text_muted": (180, 210, 255),
              }
          }

          THEME_KEYS = ["espn", "minimal", "synthwave", "classic"]

          # ══════════════════════════════════════════════════════
          #  BACKGROUND GENERATORS
          # ══════════════════════════════════════════════════════
          def generate_bg(frame, theme_key):
              t = THEMES[theme_key]
              bg_type = t["bg_type"]
              img = Image.new("RGBA", (W, H), (0, 0, 0, 255))
              d = ImageDraw.Draw(img, "RGBA")

              if bg_type == "pitch_black":
                  d.rectangle((0, 0, W, H), fill=(10, 10, 12, 255))

              elif bg_type == "espn_mesh":
                  d.rectangle((0, 0, W, H), fill=(8, 14, 28, 255))
                  for y in range(-H, H*2, 24):
                      d.line([(0, y), (W, y + W//2)], fill=(20, 35, 65, 120), width=3)

              elif bg_type == "synth_grid":
                  for y in range(H):
                      interp = y / H
                      r = int(15 + interp * 30)
                      g = int(5 + interp * 10)
                      b = int(35 + interp * 45)
                      d.line([(0, y), (W, y)], fill=(r, g, b, 255))
                  
                  # Perspective Grid
                  cx = W // 2
                  horizon = 400
                  for x in range(-W, W * 2, 80):
                      d.line([(cx + (x - cx) * 0.1, horizon), (x, H)], fill=(255, 0, 127, 40), width=1)
                  
                  grid_offset = int((frame * 2) % 40)
                  for y in range(horizon, H, 40):
                      d.line([(0, y + grid_offset), (W, y + grid_offset)], fill=(0, 240, 255, 30), width=1)

              elif bg_type == "royal_glow":
                  for y in range(H):
                      interp = y / H
                      r = int(5 + interp * 10)
                      g = int(20 + interp * 25)
                      b = int(55 + interp * 65)
                      d.line([(0, y), (W, y)], fill=(r, g, b, 255))
                  
                  glow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
                  gd = ImageDraw.Draw(glow)
                  cx = int(W / 2 + math.sin(frame * 0.03) * 60)
                  gd.ellipse((cx - 500, 100, cx + 500, 900), fill=(0, 140, 255, 35))
                  glow = glow.filter(ImageFilter.GaussianBlur(120))
                  img.paste(glow, (0, 0), glow)

              return img

          # ══════════════════════════════════════════════════════
          #  DRAW INDIA FLAG BADGE
          # ══════════════════════════════════════════════════════
          def draw_india_flag(img, x, y, w=58, h=38):
              d = ImageDraw.Draw(img, "RGBA")
              d.rounded_rectangle((x - 2, y - 2, x + w + 2, y + h + 2), radius=6, fill=(255, 255, 255, 30), outline=(255, 255, 255, 100), width=1)
              bh = h // 3
              d.rectangle((x, y, x + w, y + bh), fill=(255, 153, 51))
              d.rectangle((x, y + bh, x + w, y + 2 * bh), fill=(255, 255, 255))
              d.rectangle((x, y + 2 * bh, x + w, y + h), fill=(19, 136, 8))
              cx, cy = x + w // 2, y + h // 2
              r = bh // 2
              d.ellipse((cx - r, cy - r, cx + r, cy + r), outline=(0, 0, 128), width=2)

          # ══════════════════════════════════════════════════════
          #  PHOTO LOADER
          # ══════════════════════════════════════════════════════
          _photo_cache = {}
          PHOTO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://results.asiangames2026.org/",
          }
          def load_photo(url):
              if not url: return None
              if url in _photo_cache: return _photo_cache[url]
              Path(PHOTO_DIR).mkdir(parents=True, exist_ok=True)
              fn = url.rsplit("/", 1)[-1]
              path = f"{PHOTO_DIR}/{fn}"
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers=PHOTO_HEADERS, timeout=20)
                      if r.ok and (r.content[:2] in (b"\xff\xd8", b"\x89P") or r.content[:4] == b"RIFF"):
                          open(path, "wb").write(r.content)
                      else:
                          _photo_cache[url] = None; return None
                  except Exception:
                      _photo_cache[url] = None; return None
              try:
                  img = Image.open(path).convert("RGBA")
                  _photo_cache[url] = img
                  return img
              except:
                  _photo_cache[url] = None; return None

          # ══════════════════════════════════════════════════════
          #  DATA PROCESSING
          # ══════════════════════════════════════════════════════
          def collect(data, limit):
              rank_map = {"gold": 3, "silver": 2, "bronze": 1}
              by_sport = {}
              for a in data:
                  if not a.get("photo_url"): continue
                  medals = a.get("medals") or []
                  if not medals: continue
                  g = sum(1 for m in medals if m["medal"] == "gold")
                  s = sum(1 for m in medals if m["medal"] == "silver")
                  b = sum(1 for m in medals if m["medal"] == "bronze")
                  top = sorted(medals, key=lambda m: rank_map.get(m["medal"], 0), reverse=True)[0]
                  sport = a.get("disc_desc", "Other")
                  entry = {
                      "name": a["name"], 
                      "disc_desc": sport,
                      "event": top["event"], 
                      "medal": top["medal"],
                      "result": top.get("result") or top.get("mark") or "",
                      "rank": top.get("rank") or f"Rank {top.get('rank_num', '')}".strip(),
                      "score": g*100 + s*10 + b,
                      "photo_url": a["photo_url"],
                      "medal_count": len(medals),
                  }
                  by_sport.setdefault(sport, []).append(entry)

              sports = sorted(by_sport.keys())
              picked = []
              i = 0
              while len(picked) < limit:
                  added = False
                  for sp in sports:
                      if i < len(by_sport[sp]):
                          item = by_sport[sp][i]
                          # Assign theme in repeating loop order across option 1, 2, 3, 4
                          item["theme_key"] = THEME_KEYS[len(picked) % len(THEME_KEYS)]
                          picked.append(item)
                          added = True
                          if len(picked) >= limit: break
                  if not added: break
                  i += 1
              return picked

          # ══════════════════════════════════════════════════════
          #  DRAW — CARD
          # ══════════════════════════════════════════════════════
          def draw_card(img, ath, photo, idx, total):
              d = ImageDraw.Draw(img, "RGBA")
              t = THEMES[ath["theme_key"]]
              medal = ath["medal"].lower()

              # Top Ticker Header
              d.rectangle((0, 0, W, 70), fill=(10, 10, 14, 240))
              d.line([(0, 70), (W, 70)], fill=t["accent"], width=2)
              d.text((SAFE_X, 18), "ASIAN GAMES 2026", font=font(28, "black"), fill=t["text_main"])
              d.rectangle((SAFE_X + 280, 22, SAFE_X + 284, 48), fill=t["accent"])
              d.text((SAFE_X + 300, 20), f"STYLE: {t['name']}", font=font(20, "bold"), fill=t["accent"])
              d.text((W - SAFE_X, 18), f"MEDALIST {idx+1:02d}/{total:02d}", font=font(28, "black"), fill=t["text_main"], anchor="rt")

              # Photo Frame
              psize = 680
              px, py = SAFE_X + 20, 180

              d.rounded_rectangle((px, py, px + psize, py + psize), radius=20, fill=t["panel_bg"], outline=t["panel_border"], width=3)

              if photo:
                  w, h = photo.size
                  s = min(w, h)
                  cropped = photo.crop(((w-s)//2, (h-s)//2, (w+s)//2, (h+s)//2)).resize((psize-40, psize-40), Image.LANCZOS)
                  mask = Image.new("L", (psize-40, psize-40), 0)
                  mdraw = ImageDraw.Draw(mask)
                  mdraw.rounded_rectangle((0, 0, psize-40, psize-40), radius=16, fill=255)
                  img.paste(cropped, (px + 20, py + 20), mask)

              # Main Content Panel
              wx, wy = SAFE_X + 740, 180
              ww, wh = W - wx - SAFE_X, 680

              d.rounded_rectangle((wx, wy, wx + ww, wy + wh), radius=20, fill=t["panel_bg"], outline=t["panel_border"], width=3)

              # Medal Pill
              bw, bh = 180, 56
              bx, by = wx + ww - bw - 40, wy + 35
              d.rounded_rectangle((bx, by, bx + bw, by + bh), radius=12, fill=t["accent"], outline=t["panel_border"], width=1)
              d.text((bx + bw // 2, by + bh // 2), medal.upper(), font=font(28, "black"), fill=(10, 10, 10), anchor="mm")

              d.text((wx + 40, wy + 42), ath["disc_desc"].upper(), font=font(24, "bold"), fill=t["accent"])

              raw_name = ath["name"].strip()
              parts = raw_name.split()
              formatted_name = f"{parts[-1]} {' '.join(parts[:-1])}".upper() if len(parts) > 1 else raw_name.upper()

              fname = font(64, "black")
              while d.textlength(formatted_name, font=fname) > ww - 260 and fname.size > 34:
                  fname = font(fname.size - 4, "black")
              d.text((wx + 40, wy + 88), formatted_name, font=fname, fill=t["text_main"])

              d.line([(wx + 40, wy + 185), (wx + ww - 40, wy + 185)], fill=t["panel_border"], width=1)

              d.text((wx + 40, wy + 215), "EVENT / CATEGORY", font=font(18, "bold"), fill=t["text_muted"])
              d.text((wx + 40, wy + 248), ath["event"].upper(), font=font(34, "bold"), fill=t["text_main"])

              if ath.get("result") or ath.get("rank"):
                  stat_y = wy + 320
                  d.rounded_rectangle((wx + 40, stat_y, wx + ww - 40, stat_y + 65), radius=10, fill=(0, 0, 0, 120), outline=t["accent"], width=1)
                  stat_str = f"RESULT: {ath.get('result', '')}   |   {ath.get('rank', '').upper()}"
                  d.text((wx + 60, stat_y + 32), stat_str, font=font(22, "bold"), fill=t["accent"], anchor="lm")

              d.text((wx + 40, wy + 430), "NATIONAL DELEGATION", font=font(18, "bold"), fill=t["text_muted"])
              d.text((wx + 40, wy + 465), "TEAM INDIA", font=font(36, "black"), fill=t["text_main"])
              draw_india_flag(img, x=wx + 275, y=wy + 468, w=58, h=38)

              # Bottom Ticker Bar
              bar_y = H - 120
              d.rectangle((0, bar_y, W, bar_y + 66), fill=(10, 10, 14, 250))
              d.rectangle((0, bar_y, 16, bar_y + 66), fill=t["accent"])
              ticker_text = f"ASIAN GAMES 2026  //  {ath['disc_desc'].upper()}  —  {ath['event'].upper()}  —  {medal.upper()} MEDALIST"
              d.text((40, bar_y + 33), ticker_text, font=font(22, "bold"), fill=t["text_main"], anchor="lm")

          # ══════════════════════════════════════════════════════
          #  MAIN PIPELINE EXECUTION
          # ══════════════════════════════════════════════════════
          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} not found"); sys.exit(1)

          with open(DATA_IN, encoding="utf-8") as f:
              data = json.load(f)

          athletes = collect(data, TEST_LIMIT)
          n_ath = len(athletes)

          for a in athletes:
              a["_photo"] = load_photo(a["photo_url"])

          ffmpeg_cmd = [
              "ffmpeg", "-y", "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgb24", "-r", str(FPS), "-i", "-",
              "-c:v", "libx264", "-preset", "medium", "-crf", "20", "-pix_fmt", "yuv420p",
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8",
          ]

          proc = subprocess.Popen(ffmpeg_cmd, stdin=subprocess.PIPE)

          def push_frame(img):
              proc.stdin.write(img.convert("RGB").tobytes())

          # Render Intro (Uses Asian Games Classic Style)
          for f in range(INTRO_FRAMES):
              img = generate_bg(f, "classic")
              d = ImageDraw.Draw(img, "RGBA")
              d.text((W/2, 400), "ASIAN GAMES 2026", font=font(100, "black"), fill=(255, 255, 255), anchor="mt")
              d.text((W/2, 540), "MULTI-THEME SHOWCASE", font=font(50, "bold"), fill=(255, 215, 0), anchor="mt")
              push_frame(img)

          # Render Cards with Rotated Themes
          for i, ath in enumerate(athletes):
              print(f"  [{i+1}/{n_ath}] {ath['name']} -> Theme: {ath['theme_key'].upper()}")
              for f in range(CARD_FRAMES):
                  img = generate_bg(f, ath["theme_key"])
                  draw_card(img, ath, ath["_photo"], i, n_ath)
                  push_frame(img)

          # Render Outro
          for f in range(OUTRO_FRAMES):
              img = generate_bg(f, "synthwave")
              d = ImageDraw.Draw(img, "RGBA")
              d.text((W/2, 450), "OFFICIAL BROADCAST COMPLETE", font=font(70, "black"), fill=(255, 255, 255), anchor="mt")
              push_frame(img)

          proc.stdin.close()
          proc.wait()
          print("✅ HLS multi-theme video rendered successfully!")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: multi-theme HLS update [skip ci]" && git push
          )
