name: Build HLS Video (TV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Setup folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          [ -f data/athletes.json ] && cp data/athletes.json docs/data/athletes.json || true

      - name: Render + encode
        run: |
          python -u - <<'PYEOF'
          import sys
          sys.stdout.reconfigure(line_buffering=True)

          import json, os, math, random, shutil, subprocess
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ══════════════════════════════════════════════════════
          #  CONFIG — TV (1920×1080 landscape)
          # ══════════════════════════════════════════════════════
          W, H        = 1920, 1080
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          FRAME_DIR   = "build/frames"
          OUT_DIR     = "docs/hls"

          TEST_LIMIT  = 10
          INTRO_FRAMES   = 120    # 4.0 s
          CARD_FRAMES    = 120    # 4.0 s per athlete
          OUTRO_FRAMES   = 150    # 5.0 s

          # Broadcast safe margins (90% title-safe)
          SAFE_X = 96
          SAFE_Y = 54

          # ══════════════════════════════════════════════════════
          #  MODERN PALETTE & THEMING
          # ══════════════════════════════════════════════════════
          BG_DARK      = (15, 23, 42)       # Slate 900
          PANEL_BG     = (30, 41, 59, 200)   # Slate 800 with Transparency
          PANEL_BORDER = (51, 65, 85, 250)   # Slate 700
          CYAN_ACCENT  = (6, 182, 212)      # Cyan 500
          TEXT_MAIN    = (248, 250, 252)    # Slate 50
          TEXT_MUTED   = (148, 163, 184)    # Slate 400

          GOLD       = (251, 191, 36)   # Amber Gold
          SILVER     = (226, 232, 240)  # Slate Silver
          BRONZE     = (249, 115, 22)   # Bright Bronze/Orange

          MEDAL_FILL = {"gold": GOLD, "silver": SILVER, "bronze": BRONZE}
          MEDAL_DARK = {"gold": (180, 110, 15), "silver": (120, 125, 140), "bronze": (115, 65, 25)}

          for d in [PHOTO_DIR, FRAME_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          # ══════════════════════════════════════════════════════
          #  FONTS
          # ══════════════════════════════════════════════════════
          FONT_DIRS = [
              "/usr/share/fonts/truetype/roboto/hinted/",
              "/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/",
              "/usr/share/fonts/truetype/dejavu/",
          ]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = d + n
                      if os.path.exists(p): return p
              return None

          F_BLACK = _find(["Roboto-Black.ttf", "Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_BOLD  = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_MED   = _find(["Roboto-Medium.ttf", "DejaVuSans-Bold.ttf"])
          F_REG   = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])

          def font(size, w="reg"):
              size = max(8, int(size))
              path = {"black": F_BLACK, "bold": F_BOLD, "med": F_MED, "reg": F_REG}[w]
              return ImageFont.truetype(path, size) if path else ImageFont.load_default()

          # ══════════════════════════════════════════════════════
          #  BACKGROUND
          # ══════════════════════════════════════════════════════
          _bg_cache = {}
          def modern_bg():
              if "modern_base" in _bg_cache:
                  return _bg_cache["modern_base"].copy()

              img = Image.new("RGBA", (W, H), BG_DARK + (255,))
              d = ImageDraw.Draw(img)
              
              # Subtle geometric grid pattern
              grid_size = 80
              for x in range(0, W, grid_size):
                  d.line([(x, 0), (x, H)], fill=(255, 255, 255, 5), width=1)
              for y in range(0, H, grid_size):
                  d.line([(0, y), (W, y)], fill=(255, 255, 255, 5), width=1)
                  
              _bg_cache["modern_base"] = img
              return img.copy()

          # Confetti
          random.seed(42)
          CONFETTI = []
          for _ in range(220):
              CONFETTI.append({
                  "x": random.randint(0, W),
                  "y0": random.randint(-H, 0),
                  "speed": random.uniform(4, 14),
                  "size": random.randint(6, 18),
                  "rot": random.uniform(0, math.pi),
                  "rot_spd": random.uniform(-0.1, 0.1),
                  "sway": random.uniform(0.5, 2.5),
                  "col": random.choice([
                      (255, 255, 255), (6, 182, 212), (251, 191, 36),
                      (249, 115, 22), (226, 232, 240), (255, 255, 255),
                  ]),
              })

          def draw_confetti(img, frame):
              d = ImageDraw.Draw(img, "RGBA")
              for p in CONFETTI:
                  y = (p["y0"] + p["speed"] * frame) % (H + 200) - 100
                  x = p["x"] + math.sin(frame * 0.05 + p["y0"] * 0.01) * p["sway"] * 20
                  s = p["size"]
                  rot = p["rot"] + p["rot_spd"] * frame
                  cx, cy = x, y
                  pts = []
                  for dx, dy in [(-s, -s//2), (s, -s//2), (s, s//2), (-s, s//2)]:
                      rx = dx * math.cos(rot) - dy * math.sin(rot)
                      ry = dx * math.sin(rot) + dy * math.cos(rot)
                      pts.append((cx + rx, cy + ry))
                  try:
                      d.polygon(pts, fill=p["col"] + (180,))
                  except:
                      pass

          # ══════════════════════════════════════════════════════
          #  EASING
          # ══════════════════════════════════════════════════════
          def ease_out(t):    return 1 - (1 - t) ** 3
          def ease_io(t):     return t * t * (3 - 2 * t)
          def ease_back(t):   return 1 + 2.7 * (t-1)**3 + 1.7 * (t-1)**2
          def lerp(a, b, t):  return a + (b - a) * t
          def clamp(v, lo=0, hi=1): return max(lo, min(hi, v))

          # ══════════════════════════════════════════════════════
          #  PHOTOS
          # ══════════════════════════════════════════════════════
          _photo_cache = {}
          PHOTO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://results.asiangames2026.org/",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          }
          def load_photo(url):
              if not url: return None
              if url in _photo_cache: return _photo_cache[url]
              Path(PHOTO_DIR).mkdir(parents=True, exist_ok=True)
              fn = url.rsplit("/", 1)[-1]
              path = f"{PHOTO_DIR}/{fn}"
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers=PHOTO_HEADERS, timeout=20)
                      if r.ok and (r.content[:2] in (b"\xff\xd8", b"\x89P") or r.content[:4] == b"RIFF"):
                          open(path, "wb").write(r.content)
                      else:
                          _photo_cache[url] = None; return None
                  except Exception:
                      _photo_cache[url] = None; return None
              try:
                  img = Image.open(path).convert("RGBA")
                  _photo_cache[url] = img
                  return img
              except:
                  _photo_cache[url] = None; return None

          def round_photo(img, size, border_col=CYAN_ACCENT, border_w=8):
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              if img is None:
                  d = ImageDraw.Draw(out)
                  d.ellipse((0, 0, size, size), fill=(30, 41, 59))
                  d.text((size/2, size/2), "?",
                         font(int(size*0.4), "bold"),
                         fill=TEXT_MUTED, anchor="mm")
              else:
                  w, h = img.size
                  s = min(w, h)
                  img = img.crop(((w-s)//2, (h-s)//2, (w+s)//2, (h+s)//2)).resize((size, size), Image.LANCZOS)
                  mask = Image.new("L", (size, size), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, size, size), fill=255)
                  out.paste(img, (0, 0), mask)

              d = ImageDraw.Draw(out)
              d.ellipse((0, 0, size-1, size-1), outline=border_col + (255,), width=border_w)
              return out

          # ══════════════════════════════════════════════════════
          #  DATA
          # ══════════════════════════════════════════════════════
          def is_numeric(r): return str(r or "").isdigit()

          def collect(data, limit):
              rank = {"gold": 3, "silver": 2, "bronze": 1}
              by_sport = {}
              for a in data:
                  if not is_numeric(a.get("reg")): continue
                  if not a.get("photo_url"): continue
                  medals = a.get("medals") or []
                  if not medals: continue

                  g = sum(1 for m in medals if m["medal"] == "gold")
                  s = sum(1 for m in medals if m["medal"] == "silver")
                  b = sum(1 for m in medals if m["medal"] == "bronze")
                  top = sorted(medals, key=lambda m: rank.get(m["medal"], 0), reverse=True)[0]
                  sport = a.get("disc_desc", "Other")

                  entry = {
                      "reg": a["reg"], "name": a["name"], "disc_desc": sport,
                      "event": top["event"], "medal": top["medal"],
                      "score": g*100 + s*10 + b,
                      "photo_url": a["photo_url"],
                      "medal_count": len(medals),
                  }
                  by_sport.setdefault(sport, []).append(entry)

              for k in by_sport:
                  by_sport[k].sort(key=lambda x: x["score"], reverse=True)

              sports = sorted(by_sport.keys())
              picked = []
              i = 0
              while len(picked) < limit:
                  added = False
                  for sp in sports:
                      if i < len(by_sport[sp]):
                          picked.append(by_sport[sp][i])
                          added = True
                          if len(picked) >= limit: break
                  if not added: break
                  i += 1
              return picked

          # ══════════════════════════════════════════════════════
          #  WINNER TEXT — large for TV
          # ══════════════════════════════════════════════════════
          def draw_winner_large(img, x_center, y_center, p, size_base=260):
              d = ImageDraw.Draw(img, "RGBA")
              text = "WINNER"
              scale = 0.85 + 0.15 * p
              f = font(int(size_base * scale), "black")
              bb = d.textbbox((0, 0), text, font=f)
              tw = bb[2] - bb[0]
              th = bb[3] - bb[1]

              d.text((x_center - tw/2, y_center - th/2),
                     text, font=f, fill=TEXT_MAIN + (int(255 * p),), anchor="lt")

          # ══════════════════════════════════════════════════════
          #  DRAW — INTRO
          # ══════════════════════════════════════════════════════
          def draw_intro(img, prog, total, bd, n_ath):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              # Top label
              d.text((W/2, SAFE_Y + 20), "ASIAN GAMES 2026",
                     font=font(56, "black"),
                     fill=TEXT_MAIN + (int(255*p),), anchor="mt")

              # WINNER big
              draw_winner_large(img, W/2, 300, p, size_base=280)

              # Big count
              if p > 0.3:
                  cp = clamp((p - 0.3) / 0.4)
                  d.text((W/2, 470), str(int(total * ease_out(cp))),
                         font=font(320, "black"),
                         fill=CYAN_ACCENT + (int(255*p),), anchor="mt")
                  d.text((W/2, 830), "MEDALS",
                         font=font(72, "black"),
                         fill=TEXT_MAIN + (int(255*p),), anchor="mt")

              if p > 0.55:
                  ap = clamp((p - 0.55) / 0.3)
                  d.text((W/2, 920), f"{n_ath} ATHLETES",
                         font=font(44, "bold"),
                         fill=TEXT_MUTED + (int(255*ap),), anchor="mt")

              # Breakdown pills
              if p > 0.7:
                  bp = clamp((p - 0.7) / 0.3)
                  items = [
                      ("GOLD", bd["gold"], GOLD),
                      ("SILVER", bd["silver"], SILVER),
                      ("BRONZE", bd["bronze"], BRONZE),
                  ]
                  pw, ph, gap = 300, 130, 30
                  x0 = (W - (3 * pw + 2 * gap)) // 2
                  y0 = 970
                  for i, (label, n, col) in enumerate(items):
                      x = x0 + i * (pw + gap)
                      d.rounded_rectangle((x, y0, x + pw, y0 + ph), radius=20,
                          fill=PANEL_BG, outline=col + (int(220 * bp),), width=2)
                      d.text((x + pw / 2, y0 + 20), str(n),
                             font=font(72, "black"),
                             fill=col + (int(255 * bp),), anchor="mt")
                      d.text((x + pw / 2, y0 + 98), label,
                             font=font(24, "bold"),
                             fill=TEXT_MUTED + (int(255 * bp),), anchor="mt")

          # ══════════════════════════════════════════════════════
          #  DRAW — MODERN CARD (TV)
          # ══════════════════════════════════════════════════════
          def draw_card(img, ath, photo, prog, idx, total):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))
              medal = ath["medal"]
              accent_col = MEDAL_FILL.get(medal, CYAN_ACCENT)

              # ── 1. MODERN TOP HUD BAR ──
              d.line([(SAFE_X, 100), (W - SAFE_X, 100)], fill=(255, 255, 255, 30), width=2)
              d.line([(SAFE_X, 100), (SAFE_X + 180, 100)], fill=CYAN_ACCENT + (255,), width=4)

              d.text((SAFE_X, 45), "ASIAN GAMES 2026", font=font(32, "black"), fill=TEXT_MAIN)
              d.text((SAFE_X + 310, 52), "// OFFICIAL MEDALIST", font=font(18, "bold"), fill=CYAN_ACCENT)

              d.text((W - SAFE_X, 45), f"{idx+1:02d} / {total:02d}", font=font(36, "black"), fill=TEXT_MAIN, anchor="rt")

              # ── 2. LEFT COLUMN: ATHLETE PORTRAIT ──
              if p > 0.1:
                  pp = ease_back(clamp((p - 0.1) / 0.4))
                  psize = 520
                  px = SAFE_X + 60
                  py = 180

                  card_rect = (px - 20, py - 20, px + psize + 20, py + psize + 20)
                  d.rounded_rectangle(card_rect, radius=24, fill=PANEL_BG, outline=PANEL_BORDER, width=2)

                  cp = round_photo(photo, psize, border_col=accent_col, border_w=10)

                  if pp < 1:
                      ns = max(30, int(psize * pp))
                      cp2 = cp.resize((ns, ns), Image.LANCZOS)
                      off = (psize - ns) // 2
                      img.paste(cp2, (px + off, py + off), cp2)
                  else:
                      img.paste(cp, (px, py), cp)

                  if p > 0.4:
                      mb_w, mb_h = 320, 70
                      mb_x = px + (psize - mb_w) // 2
                      mb_y = py + psize + 40

                      d.rounded_rectangle((mb_x, mb_y, mb_x + mb_w, mb_y + mb_h), radius=35,
                                          fill=(20, 20, 30, 230), outline=accent_col + (255,), width=3)
                      
                      label = f"★ {medal.upper()}"
                      if ath["medal_count"] > 1:
                          label += f"  (x{ath['medal_count']})"
                          
                      d.text((mb_x + mb_w//2, mb_y + mb_h//2), label,
                             font=font(28, "black"), fill=accent_col, anchor="mm")

              # ── 3. RIGHT COLUMN: TYPOGRAPHY & DETAILS ──
              tx = SAFE_X + 600 + 40
              tw = W - tx - SAFE_X

              if p > 0.2:
                  sp_ = clamp((p - 0.2) / 0.25)
                  d.text((tx, 200), ath["disc_desc"].upper(), font=font(24, "bold"), 
                         fill=CYAN_ACCENT + (int(255 * sp_),), anchor="lt")

              if p > 0.35:
                  np_ = clamp((p - 0.35) / 0.3)
                  name = ath["name"].upper()
                  fname = font(88, "black")
                  while d.textlength(name, font=fname) > tw and fname.size > 36:
                      fname = font(fname.size - 4, "black")
                      
                  d.text((tx, 240), name, font=fname, fill=TEXT_MAIN + (int(255 * np_),), anchor="lt")

              if p > 0.55:
                  ep = clamp((p - 0.55) / 0.3)
                  box_y = 380
                  box_h = 240
                  
                  d.rounded_rectangle((tx, box_y, tx + tw, box_y + box_h), radius=16,
                                      fill=PANEL_BG, outline=PANEL_BORDER, width=2)
                  
                  d.line([(tx, box_y + 20), (tx, box_y + box_h - 20)], fill=accent_col + (int(255 * ep),), width=6)

                  ev = ath["event"].upper()
                  fe = font(28, "bold")
                  while d.textlength(ev, font=fe) > tw - 60 and fe.size > 18:
                      fe = font(fe.size - 1, "bold")

                  d.text((tx + 30, box_y + 40), "EVENT CATEGORY", font=font(16, "bold"), fill=TEXT_MUTED + (int(255 * ep),))
                  d.text((tx + 30, box_y + 75), ev, font=fe, fill=TEXT_MAIN + (int(255 * ep),))

                  d.text((tx + 30, box_y + 140), "REPRESENTING", font=font(16, "bold"), fill=TEXT_MUTED + (int(255 * ep),))
                  d.text((tx + 30, box_y + 170), "TEAM INDIA 🇮🇳", font=font(26, "black"), fill=TEXT_MAIN + (int(255 * ep),))

              # ── 4. BOTTOM STREAM TICKER ──
              if p > 0.8:
                  lp = clamp((p - 0.8) / 0.2)
                  bar_h = 60
                  bar_y = H - bar_h - SAFE_Y
                  
                  d.rounded_rectangle((SAFE_X, bar_y, W - SAFE_X, bar_y + bar_h), radius=12, fill=(10, 15, 26, 230))
                  
                  ticker_text = f"RESULTS // {ath['disc_desc'].upper()} — {ath['event'].upper()} — {medal.upper()} MEDAL WINNER"
                  d.text((SAFE_X + 30, bar_y + bar_h//2), ticker_text, font=font(20, "bold"), fill=TEXT_MUTED + (int(255 * lp),), anchor="lm")

          # ══════════════════════════════════════════════════════
          #  DRAW — OUTRO
          # ══════════════════════════════════════════════════════
          def draw_outro(img, prog, total, bd, n_ath):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              d.text((W/2, SAFE_Y + 20), "ASIAN GAMES 2026",
                     font=font(56, "black"),
                     fill=TEXT_MAIN, anchor="mt")

              draw_winner_large(img, W/2, 280, min(1, p * 1.5), size_base=260)

              d.text((W/2, 470), f"{total} MEDALS · {n_ath} ATHLETES",
                     font=font(52, "black"),
                     fill=CYAN_ACCENT + (int(255*p),), anchor="mt")

              y = 620
              for label, n, col in [("GOLD", bd["gold"], GOLD),
                                    ("SILVER", bd["silver"], SILVER),
                                    ("BRONZE", bd["bronze"], BRONZE)]:
                  d.text((W/2 - 120, y), label, font=font(64, "black"),
                         fill=col + (int(255*p),), anchor="rm")
                  d.text((W/2 + 120, y), str(n), font=font(88, "black"),
                         fill=TEXT_MAIN + (int(255*p),), anchor="lm")
                  y += 120

              d.text((W/2, H - 100), "THANK YOU FOR WATCHING",
                     font=font(44, "black"),
                     fill=TEXT_MUTED + (int(255*p),), anchor="mt")

          # ══════════════════════════════════════════════════════
          #  MAIN
          # ══════════════════════════════════════════════════════
          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} not found"); sys.exit(1)

          print("Loading athletes…")
          with open(DATA_IN, encoding="utf-8") as f:
              data = json.load(f)

          athletes = collect(data, TEST_LIMIT)
          n_ath = len(athletes)
          if not n_ath:
              print("✗ No athletes"); sys.exit(1)

          seen = set(); bd = {"gold": 0, "silver": 0, "bronze": 0}
          for a in data:
              for m in a.get("medals", []):
                  k = m["medal"] + "|" + m["event"]
                  if k in seen: continue
                  seen.add(k)
                  if m["medal"] in bd: bd[m["medal"]] += 1
          total = sum(bd.values())

          print(f"Medals: {total}  {bd}")
          print(f"Showing {n_ath} athletes:")
          for a in athletes:
              print(f"  • {a['name']} — {a['medal'].upper()} ({a['disc_desc']})")

          print("Loading photos…")
          ok = 0
          for a in athletes:
              a["_photo"] = load_photo(a["photo_url"])
              if a["_photo"]: ok += 1
          print(f"  → {ok}/{n_ath} photos loaded")

          shutil.rmtree(FRAME_DIR, ignore_errors=True)
          Path(FRAME_DIR).mkdir(parents=True, exist_ok=True)

          counter = [0]
          def save(img):
              img.convert("RGB").save(f"{FRAME_DIR}/f_{counter[0]:05d}.png")
              counter[0] += 1

          print("Intro…")
          for f in range(INTRO_FRAMES):
              img = modern_bg().convert("RGBA")
              draw_confetti(img, f)
              draw_intro(img, f / (INTRO_FRAMES - 1), total, bd, n_ath)
              save(img)

          print(f"Cards ({n_ath})…")
          for i, ath in enumerate(athletes):
              print(f"  [{i+1}/{n_ath}] {ath['name']}")
              for f in range(CARD_FRAMES):
                  img = modern_bg().convert("RGBA")
                  draw_confetti(img, i * CARD_FRAMES + f)
                  draw_card(img, ath, ath["_photo"], f / (CARD_FRAMES - 1), i, n_ath)
                  save(img)

          print("Outro…")
          for f in range(OUTRO_FRAMES):
              img = modern_bg().convert("RGBA")
              draw_confetti(img, n_ath * CARD_FRAMES + INTRO_FRAMES + f)
              draw_outro(img, f / (OUTRO_FRAMES - 1), total, bd, n_ath)
              save(img)

          print(f"✅ {counter[0]} frames")

          print("Encoding HLS…")
          Path(OUT_DIR).mkdir(parents=True, exist_ok=True)
          for old in Path(OUT_DIR).glob("*.ts"): old.unlink()
          for old in Path(OUT_DIR).glob("*.m3u8"): old.unlink()

          subprocess.run([
              "ffmpeg", "-y",
              "-framerate", str(FPS),
              "-i", f"{FRAME_DIR}/f_%05d.png",
              "-c:v", "libx264", "-preset", "medium", "-crf", "20",
              "-pix_fmt", "yuv420p",
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8",
          ], check=True)

          shutil.rmtree("build", ignore_errors=True)
          files = sorted(Path(OUT_DIR).glob("*"))
          print(f"✅ HLS → {OUT_DIR}/ ({len(files)} files)")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: rebuild HLS [skip ci]" && git push
          )
