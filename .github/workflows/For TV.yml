name: Build HLS Video (TV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Cache Photo Downloads
        uses: actions/cache@v4
        with:
          path: data/video-photos
          key: video-photos-${{ hashFiles('docs/data/athletes.json') }}
          restore-keys: |
            video-photos-

      - name: Setup folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          [ -f data/athletes.json ] && cp data/athletes.json docs/data/athletes.json || true

      - name: Render + encode HLS Direct Stream
        run: |
          python -u - <<'PYEOF'
          import sys, os, math, random, shutil, subprocess, json, re
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ══════════════════════════════════════════════════════
          #  CONFIG — 1920×1080 CLASSIC BROADCAST
          # ══════════════════════════════════════════════════════
          W, H        = 1920, 1080
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          OUT_DIR     = "docs/hls"

          TEST_LIMIT  = 10
          INTRO_FRAMES   = 120    # 4.0 s
          CARD_FRAMES    = 120    # 4.0 s per athlete
          OUTRO_FRAMES   = 150    # 5.0 s

          SAFE_X = 80
          SAFE_Y = 50

          # ══════════════════════════════════════════════════════
          #  THEME & MEDAL PALETTES
          # ══════════════════════════════════════════════════════
          NAVY_PANEL    = (10, 28, 64)
          PANEL_DARK    = (5, 15, 38)
          BORDER_BLUE   = (40, 110, 220)
          TEXT_WHITE    = (255, 255, 255)
          TEXT_MUTED    = (170, 200, 240)
          TEXT_DARK     = (20, 20, 20)

          # Authentic Medal Palette
          MEDAL_STYLES = {
              "gold": {
                  "bg": (255, 215, 0),          # Genuine Metallic Gold
                  "border": (218, 165, 32),      # Darker Goldenrod
                  "text": (30, 20, 0),
                  "accent": (255, 215, 0),
              },
              "silver": {
                  "bg": (224, 232, 240),        # Pure Platinum Silver
                  "border": (160, 175, 195),     # Metallic Slate Silver
                  "text": (15, 25, 35),
                  "accent": (200, 215, 230),
              },
              "bronze": {
                  "bg": (205, 127, 50),         # Authentic Copper Bronze
                  "border": (140, 75, 25),       # Deep Bronze Outer
                  "text": (25, 10, 0),
                  "accent": (225, 140, 65),
              }
          }

          for d in [PHOTO_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          # ══════════════════════════════════════════════════════
          #  FONTS SETUP
          # ══════════════════════════════════════════════════════
          FONT_DIRS = [
              "/usr/share/fonts/truetype/roboto/hinted/",
              "/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/",
              "/usr/share/fonts/truetype/dejavu/",
          ]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = os.path.join(d, n)
                      if os.path.exists(p): return p
              return None

          F_BLACK = _find(["Roboto-Black.ttf", "Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_BOLD  = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_MED   = _find(["Roboto-Medium.ttf", "DejaVuSans-Bold.ttf"])
          F_REG   = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])

          def font(size, w="reg"):
              size = max(8, int(size))
              path = {"black": F_BLACK, "bold": F_BOLD, "med": F_MED, "reg": F_REG}.get(w, F_REG)
              return ImageFont.truetype(path, size) if path else ImageFont.load_default()

          # ══════════════════════════════════════════════════════
          #  BACKGROUND — CLASSIC ROYAL BLUE GRADIENT
          # ══════════════════════════════════════════════════════
          def generate_classic_bg(frame):
              img = Image.new("RGBA", (W, H), (0, 0, 0, 255))
              d = ImageDraw.Draw(img, "RGBA")

              for y in range(H):
                  interp = y / H
                  r = int(6 + interp * 12)
                  g = int(22 + interp * 28)
                  b = int(60 + interp * 70)
                  d.line([(0, y), (W, y)], fill=(r, g, b, 255))

              glow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              gd = ImageDraw.Draw(glow)
              cx = int(W / 2 + math.sin(frame * 0.02) * 50)
              gd.ellipse((cx - 600, -100, cx + 600, 800), fill=(0, 140, 255, 30))
              glow = glow.filter(ImageFilter.GaussianBlur(130))
              img.paste(glow, (0, 0), glow)

              return img

          # ══════════════════════════════════════════════════════
          #  DRAW INDIA FLAG BADGE
          # ══════════════════════════════════════════════════════
          def draw_india_flag(img, x, y, w=58, h=38):
              d = ImageDraw.Draw(img, "RGBA")
              d.rounded_rectangle((x - 2, y - 2, x + w + 2, y + h + 2), radius=6, fill=(255, 255, 255, 30), outline=(255, 215, 0), width=1)
              bh = h // 3
              d.rectangle((x, y, x + w, y + bh), fill=(255, 153, 51))
              d.rectangle((x, y + bh, x + w, y + 2 * bh), fill=(255, 255, 255))
              d.rectangle((x, y + 2 * bh, x + w, y + h), fill=(19, 136, 8))
              cx, cy = x + w // 2, y + h // 2
              r = bh // 2
              d.ellipse((cx - r, cy - r, cx + r, cy + r), outline=(0, 0, 128), width=2)

          # ══════════════════════════════════════════════════════
          #  PHOTO LOADER
          # ══════════════════════════════════════════════════════
          _photo_cache = {}
          PHOTO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://results.asiangames2026.org/",
          }
          def load_photo(url):
              if not url: return None
              if url in _photo_cache: return _photo_cache[url]
              Path(PHOTO_DIR).mkdir(parents=True, exist_ok=True)
              fn = url.rsplit("/", 1)[-1]
              path = os.path.join(PHOTO_DIR, fn)
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers=PHOTO_HEADERS, timeout=20)
                      if r.ok and len(r.content) > 0:
                          open(path, "wb").write(r.content)
                      else:
                          _photo_cache[url] = None; return None
                  except Exception:
                      _photo_cache[url] = None; return None
              try:
                  img = Image.open(path).convert("RGBA")
                  _photo_cache[url] = img
                  return img
              except Exception:
                  _photo_cache[url] = None; return None

          # ══════════════════════════════════════════════════════
          #  DATA PROCESSING (MATCHES WEBSITE LOGIC)
          # ══════════════════════════════════════════════════════
          def get_participant(a):
              bio = a.get("bio_data") or {}
              if not bio: return {}
              return bio.get("participant") or bio.get("Participant") or bio.get("profile") or bio.get("Profile") or bio

          def is_aggregate_team(a):
              p = get_participant(a)
              if p and (p.get("hasMembers") is True or p.get("Type") in ["T", "D"]): return True
              reg = a.get("reg", "")
              if re.search(r"^[A-Z]{3}[A-Z0-9]*TEAM", reg, re.I) or re.search(r"DOUBLES", reg, re.I) or re.search(r"SCULL\d", reg, re.I):
                  return True
              return False

          def collect(data, limit):
              rank_map = {"gold": 3, "silver": 2, "bronze": 1}
              by_sport = {}
              
              for a in data:
                  if is_aggregate_team(a): continue
                  if not a.get("photo_url"): continue
                  medals = a.get("medals") or []
                  if not medals: continue

                  g = sum(1 for m in medals if str(m.get("medal", "")).lower() == "gold")
                  s = sum(1 for m in medals if str(m.get("medal", "")).lower() == "silver")
                  b = sum(1 for m in medals if str(m.get("medal", "")).lower() == "bronze")

                  top = sorted(medals, key=lambda m: rank_map.get(str(m.get("medal", "")).lower(), 0), reverse=True)[0]
                  sport = a.get("disc_desc") or "Other"

                  p = get_participant(a)
                  gender_raw = p.get("Gender") or a.get("gender") or a.get("gender_desc") or ""
                  gender = "MALE" if gender_raw == "M" else "FEMALE" if gender_raw == "W" else "ATHLETE"

                  venue = top.get("venue") or top.get("VenueDesc") or top.get("location") or "Main Aquatics & Athletics Arena"

                  # Safe Extraction for Results
                  res_val = top.get("result") or top.get("Result") or top.get("mark") or top.get("time") or top.get("score")
                  if not res_val or str(res_val).strip() in ("", "None"):
                      res_val = "N/A"

                  # Safe Extraction for Standing Rank
                  raw_rank = top.get("rank") or top.get("Rank") or top.get("rank_num") or top.get("RkPo")
                  if raw_rank is not None and str(raw_rank).strip() not in ("", "None", "N/A"):
                      r_str = str(raw_rank).strip()
                      rank_str = f"2ND PLACE" if r_str == "2" else f"1ST PLACE" if r_str == "1" else f"3RD PLACE" if r_str == "3" else f"RANK {r_str}"
                  else:
                      rank_str = ""

                  entry = {
                      "name": a.get("name", "Unknown Athlete"), 
                      "disc_desc": sport,
                      "event": top.get("event") or top.get("EventDesc") or top.get("Desc") or "General Event", 
                      "medal": str(top.get("medal", "gold")).lower(),
                      "result": str(res_val),
                      "rank": rank_str,
                      "gender": gender,
                      "venue": venue,
                      "g_count": g, "s_count": s, "b_count": b,
                      "medal_count": len(medals),
                      "score": g*100 + s*10 + b,
                      "photo_url": a["photo_url"],
                  }
                  by_sport.setdefault(sport, []).append(entry)

              sports = sorted(by_sport.keys())
              picked = []
              i = 0
              while len(picked) < limit:
                  added = False
                  for sp in sports:
                      if i < len(by_sport[sp]):
                          picked.append(by_sport[sp][i])
                          added = True
                          if len(picked) >= limit: break
                  if not added: break
                  i += 1
              return picked

          # ══════════════════════════════════════════════════════
          #  DRAW — CARD WITH AUTHENTIC MEDAL COLORS
          # ══════════════════════════════════════════════════════
          def draw_card(img, ath, photo, idx, total):
              d = ImageDraw.Draw(img, "RGBA")
              medal_type = ath["medal"] if ath["medal"] in MEDAL_STYLES else "gold"
              m_cfg = MEDAL_STYLES[medal_type]

              # Top Ticker Header
              d.rectangle((0, 0, W, 70), fill=(8, 20, 48, 245))
              d.line([(0, 70), (W, 70)], fill=m_cfg["accent"], width=2)
              d.text((SAFE_X, 18), "ASIAN GAMES 2026  |  OFFICIAL ATHLETE PROFILE", font=font(26, "black"), fill=TEXT_WHITE)
              d.text((W - SAFE_X, 18), f"FEATURED {idx+1:02d} / {total:02d}", font=font(26, "black"), fill=m_cfg["accent"], anchor="rt")

              # Photo Frame Box
              psize = 680
              px, py = SAFE_X, 150

              d.rounded_rectangle((px, py, px + psize, py + psize), radius=16, fill=NAVY_PANEL, outline=BORDER_BLUE, width=2)

              if photo:
                  w, h = photo.size
                  s = min(w, h)
                  crop_w, crop_h = psize - 40, psize - 40
                  cropped = photo.crop(((w - s) // 2, (h - s) // 2, (w + s) // 2, (h + s) // 2)).resize((crop_w, crop_h), Image.LANCZOS)
                  
                  mask = Image.new("L", (crop_w, crop_h), 0)
                  mdraw = ImageDraw.Draw(mask)
                  mdraw.rounded_rectangle((0, 0, crop_w, crop_h), radius=12, fill=255)
                  
                  img.paste(cropped, (px + 20, py + 20), mask)

              # Main Content Panel
              wx, wy = SAFE_X + 720, 150
              ww, wh = W - wx - SAFE_X, 680

              d.rounded_rectangle((wx, wy, wx + ww, wy + wh), radius=16, fill=NAVY_PANEL, outline=BORDER_BLUE, width=2)

              # Authentic Medal Badge Pill
              bw, bh = 200, 56
              bx, by = wx + ww - bw - 35, wy + 30
              d.rounded_rectangle((bx, by, bx + bw, by + bh), radius=8, fill=m_cfg["bg"], outline=m_cfg["border"], width=2)
              d.text((bx + bw // 2, by + bh // 2), medal_type.upper(), font=font(28, "black"), fill=m_cfg["text"], anchor="mm")

              # Sport Discipline + Gender Tag
              d.text((wx + 35, wy + 35), f"{ath['disc_desc'].upper()}  •  {ath['gender']}", font=font(22, "bold"), fill=m_cfg["accent"])

              # Formatted Name
              raw_name = ath["name"].strip()
              parts = raw_name.split()
              formatted_name = f"{parts[-1]} {' '.join(parts[:-1])}".upper() if len(parts) > 1 else raw_name.upper()

              fname = font(58, "black")
              while d.textlength(formatted_name, font=fname) > ww - 270 and fname.size > 32:
                  fname = font(fname.size - 4, "black")
              d.text((wx + 35, wy + 75), formatted_name, font=fname, fill=TEXT_WHITE)

              d.line([(wx + 35, wy + 160), (wx + ww - 35, wy + 160)], fill=(255, 255, 255, 40), width=1)

              # Detailed Info Sections
              d.text((wx + 35, wy + 180), "EVENT / CATEGORY", font=font(16, "bold"), fill=TEXT_MUTED)
              d.text((wx + 35, wy + 205), ath["event"].upper(), font=font(28, "bold"), fill=TEXT_WHITE)

              d.text((wx + 35, wy + 260), "VENUE / LOCATION", font=font(16, "bold"), fill=TEXT_MUTED)
              d.text((wx + 35, wy + 285), ath["venue"].upper(), font=font(24, "bold"), fill=TEXT_WHITE)

              # Performance Stats Panel (Opaque dark fill avoids contrast washouts)
              stat_y = wy + 340
              d.rounded_rectangle((wx + 35, stat_y, wx + ww - 35, stat_y + 110), radius=10, fill=PANEL_DARK, outline=m_cfg["accent"], width=1)
              d.text((wx + 55, stat_y + 20), "PERFORMANCE MARK & STANDING", font=font(16, "bold"), fill=TEXT_MUTED)
              
              res_str = f"TIME / MARK: {ath['result']}"
              if ath.get("rank"):
                  res_str += f"   |   OFFICIAL {ath['rank']}"
              d.text((wx + 55, stat_y + 55), res_str, font=font(24, "bold"), fill=m_cfg["accent"])

              # Delegation & Career Medals Breakdown
              d.text((wx + 35, wy + 480), "NATIONAL DELEGATION", font=font(16, "bold"), fill=TEXT_MUTED)
              d.text((wx + 35, wy + 510), "TEAM INDIA", font=font(34, "black"), fill=TEXT_WHITE)
              draw_india_flag(img, x=wx + 260, y=wy + 512, w=58, h=38)

              career_str = f"TOTAL MEDALS WON: {ath['medal_count']} ({ath['g_count']} GOLD, {ath['s_count']} SILVER, {ath['b_count']} BRONZE)"
              d.rounded_rectangle((wx + 35, wy + 580, wx + ww - 35, wy + 640), radius=8, fill=PANEL_DARK, outline=m_cfg["accent"], width=1)
              d.text((wx + 55, wy + 610), career_str, font=font(20, "bold"), fill=TEXT_WHITE, anchor="lm")

              # Bottom Ticker Bar
              bar_y = H - 120
              d.rectangle((0, bar_y, W, bar_y + 66), fill=(6, 16, 40, 250))
              d.rectangle((0, bar_y, 16, bar_y + 66), fill=m_cfg["bg"])
              ticker_text = f"ASIAN GAMES 2026  //  {ath['disc_desc'].upper()}  —  {ath['event'].upper()}  —  {medal_type.upper()} MEDALIST ({ath['result']})"
              d.text((40, bar_y + 33), ticker_text, font=font(22, "bold"), fill=TEXT_WHITE, anchor="lm")

          # ══════════════════════════════════════════════════════
          #  MAIN PIPELINE EXECUTION
          # ══════════════════════════════════════════════════════
          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} not found"); sys.exit(1)

          with open(DATA_IN, encoding="utf-8") as f:
              data = json.load(f)

          athletes = collect(data, TEST_LIMIT)
          n_ath = len(athletes)

          if n_ath == 0:
              print("⚠️ No valid athlete records with photos and medals found.")
              sys.exit(0)

          for a in athletes:
              a["_photo"] = load_photo(a["photo_url"])

          ffmpeg_cmd = [
              "ffmpeg", "-y", "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgb24", "-r", str(FPS), "-i", "-",
              "-c:v", "libx264", "-preset", "medium", "-crf", "20", "-pix_fmt", "yuv420p",
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8",
          ]

          proc = subprocess.Popen(ffmpeg_cmd, stdin=subprocess.PIPE)

          def push_frame(img):
              try:
                  proc.stdin.write(img.convert("RGB").tobytes())
              except IOError as e:
                  print(f"FFmpeg stdin pipe error: {e}")
                  sys.exit(1)

          try:
              # Render Intro
              print("Rendering Classic Intro…")
              for f in range(INTRO_FRAMES):
                  img = generate_classic_bg(f)
                  d = ImageDraw.Draw(img, "RGBA")
                  d.text((W/2, 380), "ASIAN GAMES 2026", font=font(100, "black"), fill=TEXT_WHITE, anchor="mt")
                  d.text((W/2, 520), "OFFICIAL MEDALISTS & PROFILE BROADCAST", font=font(44, "bold"), fill=MEDAL_STYLES["gold"]["bg"], anchor="mt")
                  push_frame(img)

              # Render Cards
              print(f"Rendering {n_ath} Classic Athlete Cards with medal-specific colors…")
              for i, ath in enumerate(athletes):
                  print(f"  [{i+1}/{n_ath}] {ath['name']} ({ath['medal'].upper()})")
                  for f in range(CARD_FRAMES):
                      img = generate_classic_bg(i * CARD_FRAMES + f)
                      draw_card(img, ath, ath["_photo"], i, n_ath)
                      push_frame(img)

              # Render Outro
              print("Rendering Classic Outro…")
              for f in range(OUTRO_FRAMES):
                  img = generate_classic_bg(n_ath * CARD_FRAMES + INTRO_FRAMES + f)
                  d = ImageDraw.Draw(img, "RGBA")
                  d.text((W/2, 420), "OFFICIAL BROADCAST COMPLETE", font=font(70, "black"), fill=TEXT_WHITE, anchor="mt")
                  d.text((W/2, 530), "TEAM INDIA SUMMARY", font=font(36, "bold"), fill=MEDAL_STYLES["gold"]["bg"], anchor="mt")
                  push_frame(img)

          finally:
              proc.stdin.close()
              proc.wait()

          print("✅ Classic HLS video with authentic medal colors rendered successfully!")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: apply authentic gold, silver, bronze medal colors [skip ci]" && git push
          )
