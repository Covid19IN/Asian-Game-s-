name: Build HLS Video (TV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Cache Photo Downloads
        uses: actions/cache@v4
        with:
          path: data/video-photos
          key: video-photos-${{ hashFiles('docs/data/athletes.json') }}
          restore-keys: |
            video-photos-

      - name: Setup Folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          [ -f data/athletes.json ] && cp data/athletes.json docs/data/athletes.json || true

      - name: Render + Encode HLS Direct Stream
        run: |
          python -u - <<'PYEOF'
          import sys, os, math, random, shutil, subprocess, json
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          W, H        = 1920, 1080
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          OUT_DIR     = "docs/hls"

          TEST_LIMIT  = 10
          INTRO_FRAMES = 120
          CARD_FRAMES  = 120
          OUTRO_FRAMES = 150
          SAFE_X, SAFE_Y = 96, 54

          BG_CORE       = (8, 7, 10)
          ACCENT_AMBER  = (255, 119, 0)
          ACCENT_GLOW   = (255, 170, 0)
          PANEL_DARK    = (16, 14, 18, 240)
          PANEL_BORDER  = (255, 119, 0, 180)
          TEXT_WHITE    = (255, 255, 255)
          TEXT_MUTED    = (180, 160, 140)
          GOLD, SILVER, BRONZE = (255, 195, 0), (220, 225, 235), (235, 120, 40)

          for d in [PHOTO_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          FONT_DIRS = ["/usr/share/fonts/truetype/roboto/hinted/", "/usr/share/fonts/truetype/dejavu/"]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = d + n
                      if os.path.exists(p): return p
              return None

          F_BLACK = _find(["Roboto-Black.ttf", "DejaVuSans-Bold.ttf"])
          F_BOLD  = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_REG   = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])

          def font(size, w="reg"):
              path = {"black": F_BLACK, "bold": F_BOLD, "reg": F_REG}.get(w, F_REG)
              return ImageFont.truetype(path, max(8, int(size))) if path else ImageFont.load_default()

          # Pre-generate particles
          random.seed(101)
          LIGHT_PARTICLES = [{
              "x": random.randint(0, W), "y": random.randint(0, H),
              "r": random.randint(15, 60), "speed": random.uniform(0.3, 1.2),
              "alpha": random.randint(20, 60),
              "color": random.choice([ACCENT_AMBER, ACCENT_GLOW, (255, 80, 0)])
          } for _ in range(30)]

          def news_studio_bg(frame):
              img = Image.new("RGBA", (W, H), BG_CORE + (255,))
              d = ImageDraw.Draw(img, "RGBA")
              
              # Lightweight Ambient Glow
              cx1 = int(W // 2 + math.sin(frame * 0.02) * 40)
              cy1 = int(H // 2 + math.cos(frame * 0.02) * 30)
              d.ellipse((cx1 - 500, cy1 - 400, cx1 + 500, cy1 + 400), fill=(255, 100, 0, 15))

              # Corner Brackets
              bw = 40
              d.line([(30, 30), (30 + bw, 30)], fill=ACCENT_AMBER, width=2)
              d.line([(30, 30), (30, 30 + bw)], fill=ACCENT_AMBER, width=2)
              d.line([(W - 30, 30), (W - 30 - bw, 30)], fill=ACCENT_AMBER, width=2)
              d.line([(W - 30, 30), (W - 30, 30 + bw)], fill=ACCENT_AMBER, width=2)
              return img

          def load_photo(url):
              if not url: return None
              fn = url.rsplit("/", 1)[-1]
              path = f"{PHOTO_DIR}/{fn}"
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=10)
                      if r.ok: open(path, "wb").write(r.content)
                      else: return None
                  except: return None
              try: return Image.open(path).convert("RGBA")
              except: return None

          def collect(data, limit):
              rank_map = {"gold": 3, "silver": 2, "bronze": 1}
              picked = []
              for a in data:
                  if not a.get("photo_url") or not a.get("medals"): continue
                  top = sorted(a["medals"], key=lambda m: rank_map.get(m["medal"], 0), reverse=True)[0]
                  picked.append({
                      "name": a["name"], "disc_desc": a.get("disc_desc", "Sports"),
                      "event": top["event"], "medal": top["medal"],
                      "result": top.get("result") or top.get("mark") or "",
                      "photo_url": a["photo_url"], "medal_count": len(a["medals"])
                  })
                  if len(picked) >= limit: break
              return picked

          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} missing"); sys.exit(1)

          with open(DATA_IN, encoding="utf-8") as f: data = json.load(f)
          athletes = collect(data, TEST_LIMIT)
          for a in athletes: a["_photo"] = load_photo(a["photo_url"])

          # Stream directly to FFmpeg pipe to avoid saving frames to disk
          ffmpeg_cmd = [
              "ffmpeg", "-y",
              "-f", "rawvideo", "-vcodec", "rawvideo",
              "-s", f"{W}x{H}", "-pix_fmt", "rgb24", "-r", str(FPS),
              "-i", "-",
              "-c:v", "libx264", "-preset", "fast", "-crf", "22",
              "-pix_fmt", "yuv420p", "-g", "60",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8"
          ]

          proc = subprocess.Popen(ffmpeg_cmd, stdin=subprocess.PIPE)

          def send_frame(img):
              proc.stdin.write(img.convert("RGB").tobytes())

          print("Streaming intro to FFmpeg...")
          for f in range(INTRO_FRAMES):
              send_frame(news_studio_bg(f))

          print("Streaming cards...")
          for i, ath in enumerate(athletes):
              for f in range(CARD_FRAMES):
                  send_frame(news_studio_bg(i * CARD_FRAMES + f))

          print("Streaming outro...")
          for f in range(OUTRO_FRAMES):
              send_frame(news_studio_bg(f))

          proc.stdin.close()
          proc.wait()
          print(f"✅ HLS Exported successfully to {OUT_DIR}/")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: amber HUD theme update [skip ci]" && git push
          )
