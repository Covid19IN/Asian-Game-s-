name: Build HLS Video (TV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Setup folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          [ -f data/athletes.json ] && cp data/athletes.json docs/data/athletes.json || true

      - name: Render + encode
        run: |
          python -u - <<'PYEOF'
          import sys
          sys.stdout.reconfigure(line_buffering=True)

          import json, os, math, random, shutil, subprocess
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ══════════════════════════════════════════════════════
          #  CONFIG — TV BROADCAST (1920×1080)
          # ══════════════════════════════════════════════════════
          W, H        = 1920, 1080
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          FRAME_DIR   = "build/frames"
          OUT_DIR     = "docs/hls"

          TEST_LIMIT  = 10
          INTRO_FRAMES   = 120    # 4.0 s
          CARD_FRAMES    = 120    # 4.0 s per athlete
          OUTRO_FRAMES   = 150    # 5.0 s

          SAFE_X = 96
          SAFE_Y = 54

          # ══════════════════════════════════════════════════════
          #  SPORTS BROADCAST PALETTE
          # ══════════════════════════════════════════════════════
          BG_CORE       = (11, 14, 20)       # Deep Obsidian
          ACCENT_CYAN   = (0, 240, 255)      # Electric Cyan
          PANEL_DARK    = (18, 24, 38, 235)   # Semi-trans Dark Slate
          PANEL_BORDER  = (40, 55, 80, 255)   # Metallic Slate

          TEXT_WHITE    = (255, 255, 255)
          TEXT_MUTED    = (130, 150, 180)

          GOLD          = (255, 184, 0)
          SILVER        = (220, 225, 235)
          BRONZE        = (240, 120, 40)

          MEDAL_COLOR = {"gold": GOLD, "silver": SILVER, "bronze": BRONZE}

          for d in [PHOTO_DIR, FRAME_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          # ══════════════════════════════════════════════════════
          #  FONTS
          # ══════════════════════════════════════════════════════
          FONT_DIRS = [
              "/usr/share/fonts/truetype/roboto/hinted/",
              "/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/",
              "/usr/share/fonts/truetype/dejavu/",
          ]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = d + n
                      if os.path.exists(p): return p
              return None

          F_BLACK = _find(["Roboto-Black.ttf", "Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_BOLD  = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_MED   = _find(["Roboto-Medium.ttf", "DejaVuSans-Bold.ttf"])
          F_REG   = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])

          def font(size, w="reg"):
              size = max(8, int(size))
              path = {"black": F_BLACK, "bold": F_BOLD, "med": F_MED, "reg": F_REG}[w]
              return ImageFont.truetype(path, size) if path else ImageFont.load_default()

          # ══════════════════════════════════════════════════════
          #  DYNAMIC BACKGROUND GENERATOR
          # ══════════════════════════════════════════════════════
          _bg_cache = {}
          def sports_bg():
              if "sports_base" in _bg_cache:
                  return _bg_cache["sports_base"].copy()

              img = Image.new("RGBA", (W, H), BG_CORE + (255,))
              d = ImageDraw.Draw(img)

              # Diagonal Speed lines background pattern
              for x in range(-H, W + H, 40):
                  d.line([(x, 0), (x + H, H)], fill=(255, 255, 255, 3), width=8)

              # Radial Cyan Lighting Flare on bottom-right
              flare = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              fd = ImageDraw.Draw(flare)
              fd.ellipse((W - 800, H - 800, W + 200, H + 200), fill=(0, 240, 255, 25))
              flare = flare.filter(ImageFilter.GaussianBlur(120))
              img.paste(flare, (0, 0), flare)

              _bg_cache["sports_base"] = img
              return img.copy()

          # Confetti
          random.seed(42)
          CONFETTI = []
          for _ in range(180):
              CONFETTI.append({
                  "x": random.randint(0, W),
                  "y0": random.randint(-H, 0),
                  "speed": random.uniform(6, 16),
                  "size": random.randint(6, 16),
                  "rot": random.uniform(0, math.pi),
                  "rot_spd": random.uniform(-0.1, 0.1),
                  "sway": random.uniform(0.5, 2.5),
                  "col": random.choice([TEXT_WHITE, ACCENT_CYAN, GOLD, BRONZE]),
              })

          def draw_confetti(img, frame):
              d = ImageDraw.Draw(img, "RGBA")
              for p in CONFETTI:
                  y = (p["y0"] + p["speed"] * frame) % (H + 200) - 100
                  x = p["x"] + math.sin(frame * 0.05 + p["y0"] * 0.01) * p["sway"] * 20
                  s = p["size"]
                  rot = p["rot"] + p["rot_spd"] * frame
                  cx, cy = x, y
                  pts = []
                  for dx, dy in [(-s, -s//2), (s, -s//2), (s, s//2), (-s, s//2)]:
                      rx = dx * math.cos(rot) - dy * math.sin(rot)
                      ry = dx * math.sin(rot) + dy * math.cos(rot)
                      pts.append((cx + rx, cy + ry))
                  try:
                      d.polygon(pts, fill=p["col"] + (200,))
                  except:
                      pass

          # ══════════════════════════════════════════════════════
          #  EASING
          # ══════════════════════════════════════════════════════
          def ease_out(t):    return 1 - (1 - t) ** 3
          def ease_back(t):   return 1 + 2.7 * (t-1)**3 + 1.7 * (t-1)**2
          def clamp(v, lo=0, hi=1): return max(lo, min(hi, v))

          # ══════════════════════════════════════════════════════
          #  PHOTO LOADER
          # ══════════════════════════════════════════════════════
          _photo_cache = {}
          PHOTO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://results.asiangames2026.org/",
          }
          def load_photo(url):
              if not url: return None
              if url in _photo_cache: return _photo_cache[url]
              Path(PHOTO_DIR).mkdir(parents=True, exist_ok=True)
              fn = url.rsplit("/", 1)[-1]
              path = f"{PHOTO_DIR}/{fn}"
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers=PHOTO_HEADERS, timeout=20)
                      if r.ok and (r.content[:2] in (b"\xff\xd8", b"\x89P") or r.content[:4] == b"RIFF"):
                          open(path, "wb").write(r.content)
                      else:
                          _photo_cache[url] = None; return None
                  except Exception:
                      _photo_cache[url] = None; return None
              try:
                  img = Image.open(path).convert("RGBA")
                  _photo_cache[url] = img
                  return img
              except:
                  _photo_cache[url] = None; return None

          # ══════════════════════════════════════════════════════
          #  DATA PROCESSING
          # ══════════════════════════════════════════════════════
          def is_numeric(r): return str(r or "").isdigit()

          def collect(data, limit):
              rank = {"gold": 3, "silver": 2, "bronze": 1}
              by_sport = {}
              for a in data:
                  if not is_numeric(a.get("reg")): continue
                  if not a.get("photo_url"): continue
                  medals = a.get("medals") or []
                  if not medals: continue

                  g = sum(1 for m in medals if m["medal"] == "gold")
                  s = sum(1 for m in medals if m["medal"] == "silver")
                  b = sum(1 for m in medals if m["medal"] == "bronze")
                  top = sorted(medals, key=lambda m: rank.get(m["medal"], 0), reverse=True)[0]
                  sport = a.get("disc_desc", "Other")

                  entry = {
                      "reg": a["reg"], "name": a["name"], "disc_desc": sport,
                      "event": top["event"], "medal": top["medal"],
                      "score": g*100 + s*10 + b,
                      "photo_url": a["photo_url"],
                      "medal_count": len(medals),
                  }
                  by_sport.setdefault(sport, []).append(entry)

              for k in by_sport:
                  by_sport[k].sort(key=lambda x: x["score"], reverse=True)

              sports = sorted(by_sport.keys())
              picked = []
              i = 0
              while len(picked) < limit:
                  added = False
                  for sp in sports:
                      if i < len(by_sport[sp]):
                          picked.append(by_sport[sp][i])
                          added = True
                          if len(picked) >= limit: break
                  if not added: break
                  i += 1
              return picked

          # ══════════════════════════════════════════════════════
          #  DRAW — INTRO
          # ══════════════════════════════════════════════════════
          def draw_intro(img, prog, total, bd, n_ath):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              d.rectangle((0, 0, W, 8), fill=ACCENT_CYAN + (255,))
              d.text((SAFE_X, SAFE_Y), "ASIAN GAMES 2026 // BROADCAST", font=font(28, "black"), fill=ACCENT_CYAN)

              d.text((W/2, 320), "MEDAL WINNERS", font=font(140, "black"), fill=TEXT_WHITE + (int(255*p),), anchor="mt")

              if p > 0.3:
                  cp = clamp((p - 0.3) / 0.4)
                  d.text((W/2, 490), str(int(total * ease_out(cp))), font=font(260, "black"), fill=ACCENT_CYAN + (int(255*p),), anchor="mt")

              if p > 0.6:
                  bp = clamp((p - 0.6) / 0.3)
                  pw, ph, gap = 340, 110, 40
                  x0 = (W - (3 * pw + 2 * gap)) // 2
                  y0 = 840
                  for i, (label, n, col) in enumerate([("GOLD", bd["gold"], GOLD), ("SILVER", bd["silver"], SILVER), ("BRONZE", bd["bronze"], BRONZE)]):
                      x = x0 + i * (pw + gap)
                      d.rounded_rectangle((x, y0, x + pw, y0 + ph), radius=8, fill=PANEL_DARK, outline=col + (int(255*bp),), width=2)
                      d.text((x + 30, y0 + 25), label, font=font(24, "bold"), fill=col + (int(255*bp),))
                      d.text((x + pw - 30, y0 + 15), str(n), font=font(64, "black"), fill=TEXT_WHITE + (int(255*bp),), anchor="rt")

          # ══════════════════════════════════════════════════════
          #  DRAW — BROADCAST SPORTS UI CARD
          # ══════════════════════════════════════════════════════
          def draw_card(img, ath, photo, prog, idx, total):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))
              medal = ath["medal"]
              m_col = MEDAL_COLOR.get(medal, ACCENT_CYAN)

              # ── 1. TV TOP TICKER ──
              d.rectangle((0, 0, W, 70), fill=(8, 11, 16, 240))
              d.line([(0, 70), (W, 70)], fill=ACCENT_CYAN, width=2)

              d.text((SAFE_X, 18), "ASIAN GAMES 2026", font=font(28, "black"), fill=TEXT_WHITE)
              d.rectangle((SAFE_X + 280, 22, SAFE_X + 284, 48), fill=ACCENT_CYAN)
              d.text((SAFE_X + 300, 20), "OFFICIAL BROADCAST", font=font(20, "bold"), fill=ACCENT_CYAN)

              d.text((W - SAFE_X, 18), f"MEDALIST {idx+1:02d}/{total:02d}", font=font(28, "black"), fill=TEXT_WHITE, anchor="rt")

              # ── 2. ATHLETE FEATURED PHOTO (CENTER/LEFT CUTOUT) ──
              if p > 0.05:
                  pp = ease_back(clamp((p - 0.05) / 0.45))
                  psize = 680
                  px = SAFE_X + 20
                  py = 180

                  # Glass Frame Backing
                  d.polygon([
                      (px, py), (px + psize - 60, py),
                      (px + psize, py + 60), (px + psize, py + psize),
                      (px + 60, py + psize), (px, py + psize - 60)
                  ], fill=PANEL_DARK, outline=PANEL_BORDER, width=2)

                  if photo:
                      w, h = photo.size
                      s = min(w, h)
                      cropped = photo.crop(((w-s)//2, (h-s)//2, (w+s)//2, (h+s)//2)).resize((psize-40, psize-40), Image.LANCZOS)
                      mask = Image.new("L", (psize-40, psize-40), 255)
                      img.paste(cropped, (px + 20, py + 20), mask)

                  # Hexagon Accent Outline
                  d.line([(px, py), (px + psize - 60, py)], fill=m_col, width=6)

              # ── 3. RIGHT SIDE: BROADCAST WIDGET PANEL ──
              if p > 0.2:
                  wp = ease_out(clamp((p - 0.2) / 0.4))
                  wx = SAFE_X + 740
                  wy = 180
                  ww = W - wx - SAFE_X
                  wh = 680

                  # Slanted Broadcast Drawer Panel
                  d.rounded_rectangle((wx, wy, wx + ww, wy + wh), radius=16, fill=PANEL_DARK, outline=PANEL_BORDER, width=2)
                  d.line([(wx + 30, wy), (wx + 180, wy)], fill=m_col, width=6)

                  # Medal Badge Top Right of Widget
                  d.rounded_rectangle((wx + ww - 220, wy + 30, wx + ww - 30, wy + 90), radius=6, fill=m_col)
                  d.text((wx + ww - 125, wy + 60), medal.upper(), font=font(28, "black"), fill=BG_CORE, anchor="mm")

                  # Sport / Discipline
                  d.text((wx + 40, wy + 40), ath["disc_desc"].upper(), font=font(24, "bold"), fill=ACCENT_CYAN)

                  # Athlete Name
                  name = ath["name"].upper()
                  fname = font(76, "black")
                  while d.textlength(name, font=fname) > ww - 80 and fname.size > 36:
                      fname = font(fname.size - 4, "black")
                  d.text((wx + 40, wy + 80), name, font=fname, fill=TEXT_WHITE)

                  d.line([(wx + 40, wy + 190), (wx + ww - 40, wy + 190)], fill=(255, 255, 255, 30), width=2)

                  # Detailed Event Box
                  d.text((wx + 40, wy + 220), "EVENT / CATEGORY", font=font(18, "bold"), fill=TEXT_MUTED)
                  ev_text = ath["event"].upper()
                  fev = font(32, "bold")
                  while d.textlength(ev_text, font=fev) > ww - 80 and fev.size > 20:
                      fev = font(fev.size - 2, "bold")
                  d.text((wx + 40, wy + 255), ev_text, font=fev, fill=TEXT_WHITE)

                  # Representation Tag
                  d.text((wx + 40, wy + 340), "NATIONAL DELEGATION", font=font(18, "bold"), fill=TEXT_MUTED)
                  d.text((wx + 40, wy + 375), "TEAM INDIA 🇮🇳", font=font(36, "black"), fill=TEXT_WHITE)

                  # Multiple Medals Indicator
                  if ath["medal_count"] > 1:
                      d.rounded_rectangle((wx + 40, wy + 460, wx + ww - 40, wy + 540), radius=8, fill=(0, 240, 255, 20), outline=ACCENT_CYAN, width=1)
                      d.text((wx + 60, wy + 500), f"MULTIPLE MEDALIST ({ath['medal_count']} MEDALS WON)", font=font(22, "bold"), fill=ACCENT_CYAN, anchor="lm")

              # ── 4. LOWER THIRD LIVE BROADCAST TICKER ──
              if p > 0.6:
                  lp = ease_out(clamp((p - 0.6) / 0.4))
                  bar_y = H - 120
                  bar_h = 66

                  # Base bar
                  d.rectangle((0, bar_y, W, bar_y + bar_h), fill=(10, 14, 22, 250))
                  d.rectangle((0, bar_y, 16, bar_y + bar_h), fill=m_col)

                  # Live Tag
                  d.rectangle((30, bar_y + 16, 110, bar_y + 50), fill=(230, 30, 30))
                  d.text((70, bar_y + 33), "LIVE", font=font(18, "black"), fill=TEXT_WHITE, anchor="mm")

                  ticker = f"ASIAN GAMES 2026  //  {ath['disc_desc'].upper()}  —  {ath['event'].upper()}  —  {medal.upper()} MEDALIST"
                  d.text((140, bar_y + 33), ticker, font=font(22, "bold"), fill=TEXT_WHITE + (int(255*lp),), anchor="lm")

          # ══════════════════════════════════════════════════════
          #  DRAW — OUTRO
          # ══════════════════════════════════════════════════════
          def draw_outro(img, prog, total, bd, n_ath):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              d.text((W/2, 220), "ASIAN GAMES 2026", font=font(40, "black"), fill=ACCENT_CYAN, anchor="mt")
              d.text((W/2, 290), "OFFICIAL SUMMARY", font=font(100, "black"), fill=TEXT_WHITE + (int(255*p),), anchor="mt")

              d.text((W/2, 450), f"{total} TOTAL MEDALS  ·  {n_ath} ATHLETES FEATURED", font=font(36, "bold"), fill=TEXT_MUTED, anchor="mt")

              y = 560
              for label, n, col in [("GOLD MEDALS", bd["gold"], GOLD), ("SILVER MEDALS", bd["silver"], SILVER), ("BRONZE MEDALS", bd["bronze"], BRONZE)]:
                  d.text((W/2 - 40, y), label, font=font(36, "bold"), fill=col + (int(255*p),), anchor="rm")
                  d.text((W/2 + 40, y - 5), str(n), font=font(54, "black"), fill=TEXT_WHITE + (int(255*p),), anchor="lm")
                  y += 80

          # ══════════════════════════════════════════════════════
          #  MAIN EXECUTION
          # ══════════════════════════════════════════════════════
          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} not found"); sys.exit(1)

          print("Loading athletes…")
          with open(DATA_IN, encoding="utf-8") as f:
              data = json.load(f)

          athletes = collect(data, TEST_LIMIT)
          n_ath = len(athletes)
          if not n_ath:
              print("✗ No athletes"); sys.exit(1)

          seen = set(); bd = {"gold": 0, "silver": 0, "bronze": 0}
          for a in data:
              for m in a.get("medals", []):
                  k = m["medal"] + "|" + m["event"]
                  if k in seen: continue
                  seen.add(k)
                  if m["medal"] in bd: bd[m["medal"]] += 1
          total = sum(bd.values())

          print("Loading photos…")
          for a in athletes:
              a["_photo"] = load_photo(a["photo_url"])

          shutil.rmtree(FRAME_DIR, ignore_errors=True)
          Path(FRAME_DIR).mkdir(parents=True, exist_ok=True)

          counter = [0]
          def save(img):
              img.convert("RGB").save(f"{FRAME_DIR}/f_{counter[0]:05d}.png")
              counter[0] += 1

          print("Intro…")
          for f in range(INTRO_FRAMES):
              img = sports_bg().convert("RGBA")
              draw_confetti(img, f)
              draw_intro(img, f / (INTRO_FRAMES - 1), total, bd, n_ath)
              save(img)

          print(f"Cards ({n_ath})…")
          for i, ath in enumerate(athletes):
              print(f"  [{i+1}/{n_ath}] {ath['name']}")
              for f in range(CARD_FRAMES):
                  img = sports_bg().convert("RGBA")
                  draw_confetti(img, i * CARD_FRAMES + f)
                  draw_card(img, ath, ath["_photo"], f / (CARD_FRAMES - 1), i, n_ath)
                  save(img)

          print("Outro…")
          for f in range(OUTRO_FRAMES):
              img = sports_bg().convert("RGBA")
              draw_confetti(img, n_ath * CARD_FRAMES + INTRO_FRAMES + f)
              draw_outro(img, f / (OUTRO_FRAMES - 1), total, bd, n_ath)
              save(img)

          print("Encoding HLS…")
          Path(OUT_DIR).mkdir(parents=True, exist_ok=True)
          for old in Path(OUT_DIR).glob("*.ts"): old.unlink()
          for old in Path(OUT_DIR).glob("*.m3u8"): old.unlink()

          subprocess.run([
              "ffmpeg", "-y",
              "-framerate", str(FPS),
              "-i", f"{FRAME_DIR}/f_%05d.png",
              "-c:v", "libx264", "-preset", "medium", "-crf", "20",
              "-pix_fmt", "yuv420p",
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8",
          ], check=True)

          shutil.rmtree("build", ignore_errors=True)
          print(f"✅ HLS Exported successfully to {OUT_DIR}/")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: rebuild broadcast HLS [skip ci]" && git push
          )
