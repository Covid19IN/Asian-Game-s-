name: Build HLS Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Setup folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          if [ -f data/athletes.json ]; then
            cp data/athletes.json docs/data/athletes.json
          fi

      - name: Render + encode
        run: |
          python - <<'PYEOF'
          import json, os, sys, shutil, subprocess
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          W, H        = 1080, 1920
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          FRAME_DIR   = "build/frames"
          OUT_DIR     = "docs/hls"
          MAX_CARDS   = 12

          INTRO_FRAMES  = 90
          CARD_FRAMES   = 75
          OUTRO_FRAMES  = 120
          TRANS_FRAMES  = 18

          BG_TOP    = (5,  8,  22)
          BG_BOT    = (14, 10, 40)
          CARD_BG   = (18, 25, 52)
          CARD_BR   = (48, 60, 100)
          GOLD      = (255, 207, 77)
          SILVER    = (205, 214, 232)
          BRONZE    = (227, 154, 90)
          WHITE     = (255, 255, 255)
          MUTED     = (140, 150, 180)
          DIM       = (90, 100, 130)
          MEDAL_COLOR = {"gold": GOLD, "silver": SILVER, "bronze": BRONZE}

          for d in [PHOTO_DIR, FRAME_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          FONT_DIRS = [
              "/usr/share/fonts/truetype/roboto/hinted/",
              "/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/",
              "/usr/share/fonts/truetype/dejavu/",
          ]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = d + n
                      if os.path.exists(p): return p
              return None
          F_BOLD = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_MED  = _find(["Roboto-Medium.ttf", "DejaVuSans-Bold.ttf"])
          F_REG  = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])
          def font(size, w="reg"):
              path = {"bold": F_BOLD, "med": F_MED, "reg": F_REG}[w]
              return ImageFont.truetype(path, size) if path else ImageFont.load_default()

          _bg = None
          def background():
              global _bg
              if _bg is None:
                  t   = np.linspace(0, 1, H).reshape(-1, 1, 1)
                  top = np.array(BG_TOP).reshape(1, 1, 3).astype(np.float32)
                  bot = np.array(BG_BOT).reshape(1, 1, 3).astype(np.float32)
                  arr = (top * (1 - t) + bot * t).astype(np.uint8)
                  arr = np.repeat(arr, W, axis=1)
                  _bg = Image.fromarray(arr, "RGB")
              return _bg.copy()

          def ease_out(t):    return 1 - (1 - t) ** 3
          def lerp(a, b, t):  return a + (b - a) * t
          def clamp(v, lo=0, hi=1): return max(lo, min(hi, v))

          _photo_cache = {}
          PHOTO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://results.asiangames2026.org/",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          }
          def load_photo(url):
              if not url: return None
              if url in _photo_cache: return _photo_cache[url]
              Path(PHOTO_DIR).mkdir(parents=True, exist_ok=True)
              fn = url.rsplit("/", 1)[-1]
              path = f"{PHOTO_DIR}/{fn}"
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers=PHOTO_HEADERS, timeout=20)
                      print(f"  {url} -> {r.status_code} ({len(r.content)}B)")
                      if r.ok and (r.content[:2] in (b"\xff\xd8", b"\x89P") or r.content[:4] == b"RIFF"):
                          open(path, "wb").write(r.content)
                      else:
                          _photo_cache[url] = None; return None
                  except Exception as e:
                      print(f"  ERR {url}: {e}")
                      _photo_cache[url] = None; return None
              try:
                  img = Image.open(path).convert("RGBA")
                  _photo_cache[url] = img
                  return img
              except:
                  _photo_cache[url] = None; return None

          def circular_photo(img, size, ring_color, ring_w=10):
              out = Image.new("RGBA", (size, size), (0,0,0,0))
              if img is None:
                  d = ImageDraw.Draw(out)
                  d.ellipse((0,0,size,size), fill=(40,50,90))
                  d.text((size/2,size/2), "?", font=font(int(size*0.4),"bold"), fill=(140,150,180), anchor="mm")
              else:
                  w,h = img.size; s = min(w,h)
                  img = img.crop(((w-s)//2,(h-s)//2,(w+s)//2,(h+s)//2)).resize((size,size), Image.LANCZOS)
                  mask = Image.new("L", (size,size), 0)
                  ImageDraw.Draw(mask).ellipse((0,0,size,size), fill=255)
                  out.paste(img, (0,0), mask)
              d = ImageDraw.Draw(out)
              d.ellipse((0,0,size-1,size-1), outline=ring_color + (255,), width=ring_w)
              return out

          def is_numeric(r): return str(r or "").isdigit()

          def pick_athletes(data):
              rank = {"gold":3, "silver":2, "bronze":1}
              out = []
              for a in data:
                  if not is_numeric(a.get("reg")): continue
                  if not a.get("photo_url"): continue
                  medals = a.get("medals") or []
                  if not medals: continue
                  g = sum(1 for m in medals if m["medal"]=="gold")
                  s = sum(1 for m in medals if m["medal"]=="silver")
                  b = sum(1 for m in medals if m["medal"]=="bronze")
                  top = sorted(medals, key=lambda m: rank.get(m["medal"],0), reverse=True)[0]
                  out.append({"reg": a["reg"], "name": a["name"], "disc_desc": a["disc_desc"],
                              "event": top["event"], "medal": top["medal"],
                              "score": g*100+s*10+b, "photo_url": a["photo_url"],
                              "medal_count": len(medals)})
              out.sort(key=lambda x: x["score"], reverse=True)
              return out[:MAX_CARDS]

          def draw_intro(img, prog, total, bd):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))
              d.text((W/2, lerp(600,520,p)), "INDIA", font=font(150,"bold"), fill=WHITE+(int(255*p),), anchor="mt")
              d.text((W/2, lerp(810,760,p)), "ASIAN GAMES 2026", font=font(42,"med"), fill=GOLD+(int(255*p),), anchor="mt")
              if p > 0.3:
                  cp = clamp((p-0.3)/0.4)
                  d.text((W/2, 1000), str(int(total*cp)), font=font(240,"bold"), fill=WHITE+(int(255*p),), anchor="mt")
                  d.text((W/2, 1280), "MEDALS", font=font(48,"med"), fill=MUTED+(int(255*p),), anchor="mt")
              if p > 0.7:
                  bp = clamp((p-0.7)/0.3)
                  items = [("GOLD",bd["gold"],GOLD),("SILVER",bd["silver"],SILVER),("BRONZE",bd["bronze"],BRONZE)]
                  x0 = (W - (3*260+2*20))//2
                  for i,(label,n,col) in enumerate(items):
                      x = x0 + i*280
                      d.rounded_rectangle((x,1400,x+260,1540), radius=24, fill=(20,28,56,int(230*bp)), outline=col+(int(180*bp),), width=2)
                      d.text((x+130,1430), str(n), font=font(64,"bold"), fill=col+(int(255*bp),), anchor="mt")
                      d.text((x+130,1505), label, font=font(22,"med"), fill=MUTED+(int(255*bp),), anchor="mt")

          def draw_card(img, ath, photo, prog, idx, total):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))
              d.rectangle((0,0,W,8), fill=(30,40,70,255))
              d.rectangle((0,0,int(W*((idx+clamp(prog))/total)),8), fill=GOLD+(255,))
              d.text((W-50,50), f"{idx+1}/{total}", font=font(30,"med"), fill=MUTED+(255,), anchor="rt")
              y_slide = int((1-p)*120)
              cx, cy = 80, 480+y_slide
              cw, ch = W-160, 940
              mc = MEDAL_COLOR[ath["medal"]]
              d.rounded_rectangle((cx,cy,cx+cw,cy+ch), radius=52, fill=CARD_BG+(int(245*clamp(p*1.4)),), outline=CARD_BR+(int(255*clamp(p*1.4)),), width=2)
              sp = clamp(p*1.6)
              d.rounded_rectangle((cx+36,cy+36,cx+36+int((cw-72)*sp),cy+60), radius=14, fill=mc+(255,))
              psize = 380
              px = cx + (cw-psize)//2
              py = cy + 130
              cp = circular_photo(photo, psize, mc, ring_w=12)
              img.paste(cp, (px,py), cp)
              if p > 0.35:
                  bp = clamp((p-0.35)/0.35)
                  bw, bh = 240, 72
                  bx = cx + (cw-bw)//2
                  by = py + psize + 40
                  d.rounded_rectangle((bx,by,bx+bw,by+bh), radius=36, fill=mc+(int(255*bp),))
                  label = ath["medal"].upper()
                  if ath["medal_count"] > 1: label += f"  ×{ath['medal_count']}"
                  d.text((bx+bw/2,by+bh/2+2), label, font=font(30,"bold"), fill=(5,8,22,int(255*bp)), anchor="mm")
              else:
                  by = py + psize + 40
              if p > 0.5:
                  np_ = clamp((p-0.5)/0.35)
                  name = ath["name"]; fname = font(64,"bold"); ny = by+130
                  if d.textlength(name, font=fname) > cw-120:
                      words = name.split(); mid = len(words)//2 if len(words)>2 else 1
                      d.text((cx+cw/2,ny), " ".join(words[:mid]), font=fname, fill=WHITE+(int(255*np_),), anchor="mt")
                      d.text((cx+cw/2,ny+76), " ".join(words[mid:]), font=fname, fill=WHITE+(int(255*np_),), anchor="mt")
                      ny += 76
                  else:
                      d.text((cx+cw/2,ny), name, font=fname, fill=WHITE+(int(255*np_),), anchor="mt")
                  sy = ny + 110
              else:
                  sy = by + 240
              if p > 0.65:
                  sp_ = clamp((p-0.65)/0.35)
                  d.text((cx+cw/2,sy), ath["disc_desc"].upper(), font=font(34,"med"), fill=MUTED+(int(255*sp_),), anchor="mt")
              if p > 0.78:
                  ep = clamp((p-0.78)/0.22)
                  ev = ath["event"]; fe = font(26,"reg")
                  while d.textlength(ev, font=fe) > cw-100 and len(ev) > 5:
                      ev = ev[:-2] + "…"
                  d.text((cx+cw/2,sy+60), ev, font=fe, fill=DIM+(int(255*ep),), anchor="mt")

          def draw_outro(img, prog, total, bd):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))
              d.text((W/2,720), "INDIA", font=font(140,"bold"), fill=WHITE+(int(255*p),), anchor="mt")
              d.text((W/2,900), f"{total} MEDALS", font=font(72,"bold"), fill=GOLD+(int(255*p),), anchor="mt")
              y = 1180
              for label, n, col in [("GOLD",bd["gold"],GOLD),("SILVER",bd["silver"],SILVER),("BRONZE",bd["bronze"],BRONZE)]:
                  d.text((W/2-80,y), label, font=font(42,"med"), fill=col+(int(255*p),), anchor="rm")
                  d.text((W/2+80,y), str(n), font=font(54,"bold"), fill=WHITE+(int(255*p),), anchor="lm")
                  y += 110
              d.text((W/2,1750), "FOLLOW FOR LIVE UPDATES", font=font(30,"med"), fill=MUTED+(int(255*p),), anchor="mt")

          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} not found")
              sys.exit(1)

          print("Loading athletes…")
          with open(DATA_IN, encoding="utf-8") as f:
              data = json.load(f)

          athletes = pick_athletes(data)
          if not athletes:
              print("✗ No athletes")
              open(f"{OUT_DIR}/index.m3u8","w").write("#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-ENDLIST\n")
              sys.exit(0)

          seen = set(); bd = {"gold":0,"silver":0,"bronze":0}
          for a in data:
              for m in a.get("medals", []):
                  k = m["medal"]+"|"+m["event"]
                  if k in seen: continue
                  seen.add(k)
                  if m["medal"] in bd: bd[m["medal"]] += 1
          total = sum(bd.values())
          print(f"Total: {total}  {bd}")
          print(f"Cards: {len(athletes)}")

          print("Loading photos…")
          ok = 0
          for a in athletes:
              a["_photo"] = load_photo(a["photo_url"])
              if a["_photo"]: ok += 1
          print(f"  → {ok}/{len(athletes)} photos loaded")

          shutil.rmtree(FRAME_DIR, ignore_errors=True)
          Path(FRAME_DIR).mkdir(parents=True, exist_ok=True)

          n = 0
          def save(img):
              nonlocal n
              img.convert("RGB").save(f"{FRAME_DIR}/f_{n:05d}.png")
              n += 1

          print("Intro…")
          for f in range(INTRO_FRAMES):
              img = background().convert("RGBA")
              draw_intro(img, f/(INTRO_FRAMES-1), total, bd)
              save(img)

          print(f"Cards ({len(athletes)})…")
          for i, ath in enumerate(athletes):
              for f in range(CARD_FRAMES):
                  img = background().convert("RGBA")
                  prog = (f/TRANS_FRAMES)*0.5 if f < TRANS_FRAMES else 0.5 + ((f-TRANS_FRAMES)/(CARD_FRAMES-TRANS_FRAMES))*0.5
                  draw_card(img, ath, ath["_photo"], prog, i, len(athletes))
                  save(img)

          print("Outro…")
          for f in range(OUTRO_FRAMES):
              img = background().convert("RGBA")
              draw_outro(img, f/(OUTRO_FRAMES-1), total, bd)
              save(img)

          print(f"✅ {n} frames")

          print("Encoding HLS…")
          Path(OUT_DIR).mkdir(parents=True, exist_ok=True)
          for old in Path(OUT_DIR).glob("*.ts"): old.unlink()
          for old in Path(OUT_DIR).glob("*.m3u8"): old.unlink()

          subprocess.run([
              "ffmpeg", "-y",
              "-framerate", str(FPS),
              "-i", f"{FRAME_DIR}/f_%05d.png",
              "-c:v", "libx264", "-preset", "medium", "-crf", "21",
              "-pix_fmt", "yuv420p",
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8",
          ], check=True)

          shutil.rmtree("build", ignore_errors=True)

          files = sorted(Path(OUT_DIR).glob("*"))
          print(f"✅ HLS → {OUT_DIR}/ ({len(files)} files)")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: rebuild HLS [skip ci]" && git push
          )
