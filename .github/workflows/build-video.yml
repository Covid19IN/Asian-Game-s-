name: Build HLS Video

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu

      - name: Install Python deps
        run: pip install requests pillow numpy

      - name: Render + encode
        run: python scripts/render_frames.py

      - name: Verify output
        run: |
          echo "--- docs/hls ---"
          ls -lah docs/hls/ || echo "NO HLS OUTPUT!"
          echo "--- data/video-photos ---"
          ls data/video-photos/ | head || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hls/ data/video-photos/ 2>/dev/null || true
          git status
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: rebuild HLS video [skip ci]" && git push
          )
