name: Build HLS Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-roboto fonts-dejavu
          pip install requests pillow numpy

      - name: Setup folders
        run: |
          mkdir -p docs/data docs/hls data/video-photos
          [ -f data/athletes.json ] && cp data/athletes.json docs/data/athletes.json || true

      - name: Render + encode
        run: |
          python -u - <<'PYEOF'
          import sys
          sys.stdout.reconfigure(line_buffering=True)

          import json, os, math, shutil, subprocess
          from pathlib import Path
          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ══════════════════════════════════════════════════════
          #  CONFIG
          # ══════════════════════════════════════════════════════
          W, H        = 1080, 1920
          FPS         = 30
          DATA_IN     = "docs/data/athletes.json"
          PHOTO_DIR   = "data/video-photos"
          FRAME_DIR   = "build/frames"
          OUT_DIR     = "docs/hls"

          # ★ TEST MODE — 10 athletes only
          TEST_LIMIT  = 10

          INTRO_FRAMES   = 90    # 3.0 s
          SPORT_FRAMES   = 60    # 2.0 s
          CARD_FRAMES    = 60    # 2.0 s
          OUTRO_FRAMES   = 120   # 4.0 s

          # ══════════════════════════════════════════════════════
          #  PALETTE
          # ══════════════════════════════════════════════════════
          BG_0      = (3,  5,  14)
          BG_1      = (10, 14, 32)
          BG_2      = (18, 10, 42)
          CARD_BG   = (22, 28, 55)
          CARD_BG_2 = (28, 34, 68)
          CARD_BR   = (55, 70, 115)

          GOLD      = (255, 200, 60)
          GOLD_2    = (255, 235, 130)
          SILVER    = (200, 210, 230)
          SILVER_2  = (240, 245, 255)
          BRONZE    = (220, 145, 75)
          BRONZE_2  = (245, 190, 130)

          WHITE     = (255, 255, 255)
          MUTED     = (140, 152, 185)
          DIM       = (85, 95, 125)
          ACCENT    = (91, 140, 255)
          ACCENT_2  = (140, 100, 255)

          # India flag colors
          SAFFRON   = (255, 153, 51)
          GREEN     = (19, 136, 8)
          NAVY      = (0, 0, 128)

          MEDAL_RGB = {
              "gold":   (GOLD,   GOLD_2),
              "silver": (SILVER, SILVER_2),
              "bronze": (BRONZE, BRONZE_2),
          }

          for d in [PHOTO_DIR, FRAME_DIR, OUT_DIR]:
              Path(d).mkdir(parents=True, exist_ok=True)

          # ══════════════════════════════════════════════════════
          #  FONTS
          # ══════════════════════════════════════════════════════
          FONT_DIRS = [
              "/usr/share/fonts/truetype/roboto/hinted/",
              "/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/",
              "/usr/share/fonts/truetype/dejavu/",
          ]
          def _find(names):
              for d in FONT_DIRS:
                  for n in names:
                      p = d + n
                      if os.path.exists(p): return p
              return None

          F_BOLD = _find(["Roboto-Bold.ttf", "DejaVuSans-Bold.ttf"])
          F_MED  = _find(["Roboto-Medium.ttf", "DejaVuSans-Bold.ttf"])
          F_REG  = _find(["Roboto-Regular.ttf", "DejaVuSans.ttf"])
          F_LT   = _find(["Roboto-Light.ttf", "Roboto-Regular.ttf", "DejaVuSans.ttf"])

          def font(size, w="reg"):
              path = {"bold": F_BOLD, "med": F_MED, "reg": F_REG, "lt": F_LT}[w]
              return ImageFont.truetype(path, size) if path else ImageFont.load_default()

          # ══════════════════════════════════════════════════════
          #  BACKGROUND — layered gradient with radial glow
          # ══════════════════════════════════════════════════════
          _bg_base = None
          def background():
              global _bg_base
              if _bg_base is None:
                  t = np.linspace(0, 1, H).reshape(-1, 1, 1)
                  top = np.array(BG_1).reshape(1, 1, 3).astype(np.float32)
                  bot = np.array(BG_2).reshape(1, 1, 3).astype(np.float32)
                  arr = (top * (1 - t) + bot * t)
                  # top dark vignette
                  vt = np.linspace(0, 1, H)
                  vig = np.clip(1 - vt * 1.6, 0.2, 1).reshape(-1, 1, 1)
                  arr = arr * vig
                  arr = np.repeat(arr, W, axis=1).astype(np.uint8)
                  _bg_base = Image.fromarray(arr, "RGB")

              img = _bg_base.copy()
              # radial glow top-right
              glow = Image.new("RGB", (W, H), (0, 0, 0))
              gd = ImageDraw.Draw(glow)
              cx, cy, rad = W - 200, 300, 800
              for i in range(20):
                  r = rad * (1 - i / 20)
                  a = int(60 * (i / 20))
                  gd.ellipse((cx - r, cy - r, cx + r, cy + r),
                             fill=(int(ACCENT[0]*a/60), int(ACCENT[1]*a/60), int(ACCENT[2]*a/60)))
              glow = glow.filter(ImageFilter.GaussianBlur(80))
              img = Image.blend(img, Image.blend(img, glow, 0.4), 0.5)
              return img

          # ══════════════════════════════════════════════════════
          #  EASING
          # ══════════════════════════════════════════════════════
          def ease_out(t):    return 1 - (1 - t) ** 3
          def ease_io(t):     return t * t * (3 - 2 * t)
          def ease_back(t):   return 1 + 2.7 * (t-1)**3 + 1.7 * (t-1)**2
          def lerp(a, b, t):  return a + (b - a) * t
          def clamp(v, lo=0, hi=1): return max(lo, min(hi, v))
          def mix(c1, c2, t): return tuple(int(c1[i] + (c2[i] - c1[i]) * t) for i in range(3))

          # ══════════════════════════════════════════════════════
          #  PHOTOS
          # ══════════════════════════════════════════════════════
          _photo_cache = {}
          PHOTO_HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://results.asiangames2026.org/",
              "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
          }
          def load_photo(url):
              if not url: return None
              if url in _photo_cache: return _photo_cache[url]
              Path(PHOTO_DIR).mkdir(parents=True, exist_ok=True)
              fn = url.rsplit("/", 1)[-1]
              path = f"{PHOTO_DIR}/{fn}"
              if not os.path.exists(path):
                  try:
                      r = requests.get(url, headers=PHOTO_HEADERS, timeout=20)
                      if r.ok and (r.content[:2] in (b"\xff\xd8", b"\x89P") or r.content[:4] == b"RIFF"):
                          open(path, "wb").write(r.content)
                      else:
                          _photo_cache[url] = None; return None
                  except Exception:
                      _photo_cache[url] = None; return None
              try:
                  img = Image.open(path).convert("RGBA")
                  _photo_cache[url] = img
                  return img
              except:
                  _photo_cache[url] = None; return None

          def circular_photo(img, size, ring_col, ring_w=10, glow=False):
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              if img is None:
                  d = ImageDraw.Draw(out)
                  d.ellipse((0, 0, size, size), fill=(40, 50, 90))
                  d.text((size/2, size/2), "?", font=font(int(size*0.4), "bold"),
                         fill=(140, 150, 180), anchor="mm")
              else:
                  w, h = img.size
                  s = min(w, h)
                  img = img.crop(((w-s)//2, (h-s)//2, (w+s)//2, (h+s)//2)).resize((size, size), Image.LANCZOS)
                  mask = Image.new("L", (size, size), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, size, size), fill=255)
                  out.paste(img, (0, 0), mask)

              # Outer glow ring
              if glow:
                  gsize = size + 40
                  glow_layer = Image.new("RGBA", (gsize, gsize), (0, 0, 0, 0))
                  gd = ImageDraw.Draw(glow_layer)
                  gd.ellipse((0, 0, gsize, gsize), fill=ring_col + (110,))
                  glow_layer = glow_layer.filter(ImageFilter.GaussianBlur(18))
                  combined = Image.new("RGBA", (gsize, gsize), (0, 0, 0, 0))
                  combined.paste(glow_layer, (0, 0), glow_layer)
                  combined.paste(out, (20, 20), out)
                  out = combined
                  # shift draw coords
                  d = ImageDraw.Draw(out)
                  d.ellipse((20, 20, 20+size-1, 20+size-1),
                            outline=ring_col + (255,), width=ring_w)
                  # inner white ring
                  d.ellipse((20+ring_w+4, 20+ring_w+4,
                             20+size-ring_w-5, 20+size-ring_w-5),
                            outline=(255, 255, 255, 90), width=2)
                  return out

              d = ImageDraw.Draw(out)
              d.ellipse((0, 0, size-1, size-1), outline=ring_col + (255,), width=ring_w)
              return out

          # ══════════════════════════════════════════════════════
          #  DATA
          # ══════════════════════════════════════════════════════
          def is_numeric(r): return str(r or "").isdigit()

          def extract_stage(e):
              if not e: return None
              s = e.lower()
              if "semi" in s: return "SEMIFINAL"
              if "quarter" in s: return "QUARTERFINAL"
              if "bronze" in s and "final" in s: return "BRONZE FINAL"
              if "final" in s: return "FINAL"
              if "heat" in s: return "HEAT"
              if "qualif" in s: return "QUALIFICATION"
              return None

          def collect_top(data, limit):
              """Pick top `limit` athletes, diversified across sports."""
              rank = {"gold": 3, "silver": 2, "bronze": 1}
              by_sport = {}

              for a in data:
                  if not is_numeric(a.get("reg")): continue
                  if not a.get("photo_url"): continue
                  medals = a.get("medals") or []
                  if not medals: continue

                  g = sum(1 for m in medals if m["medal"] == "gold")
                  s = sum(1 for m in medals if m["medal"] == "silver")
                  b = sum(1 for m in medals if m["medal"] == "bronze")
                  top = sorted(medals, key=lambda m: rank.get(m["medal"], 0), reverse=True)[0]
                  sport = a.get("disc_desc", "Other")

                  entry = {
                      "reg": a["reg"], "name": a["name"], "disc_desc": sport,
                      "event": top["event"], "medal": top["medal"],
                      "score": g*100 + s*10 + b,
                      "photo_url": a["photo_url"],
                      "medal_count": len(medals),
                      "stage": extract_stage(top["event"]),
                  }
                  by_sport.setdefault(sport, []).append(entry)

              for k in by_sport:
                  by_sport[k].sort(key=lambda x: x["score"], reverse=True)

              # Round-robin pick across sports for diversity
              sports = sorted(by_sport.keys())
              picked = []
              i = 0
              while len(picked) < limit:
                  added = False
                  for sp in sports:
                      if i < len(by_sport[sp]):
                          picked.append(by_sport[sp][i])
                          added = True
                          if len(picked) >= limit: break
                  if not added: break
                  i += 1
              return picked

          # ══════════════════════════════════════════════════════
          #  DRAW — INTRO
          # ══════════════════════════════════════════════════════
          def draw_intro(img, prog, total, bd, n_ath):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              # India tricolor bar sliding in from top
              if p > 0:
                  bar_w = int(lerp(0, 260, p))
                  bx = (W - bar_w) // 2
                  by = int(lerp(-10, 380, ease_io(clamp(prog * 1.2))))
                  d.rounded_rectangle((bx, by, bx + bar_w, by + 10), radius=5, fill=SAFFRON + (255,))
                  d.rounded_rectangle((bx, by + 14, bx + bar_w, by + 24), radius=5, fill=WHITE + (255,))
                  d.rounded_rectangle((bx, by + 28, bx + bar_w, by + 38), radius=5, fill=GREEN + (255,))

              # "INDIA"
              y1 = int(lerp(560, 480, p))
              d.text((W/2, y1), "INDIA", font=font(160, "bold"),
                     fill=WHITE + (int(255 * p),), anchor="mt")

              # Subtitle
              y2 = int(lerp(770, 720, p))
              d.text((W/2, y2), "ASIAN GAMES 2026", font=font(42, "med"),
                     fill=GOLD + (int(255 * p),), anchor="mt")

              # Big count
              if p > 0.3:
                  cp = clamp((p - 0.3) / 0.4)
                  d.text((W/2, 940), str(int(total * ease_out(cp))),
                         font=font(260, "bold"), fill=WHITE + (int(255 * p),), anchor="mt")
                  d.text((W/2, 1240), "MEDALS", font=font(48, "med"),
                         fill=MUTED + (int(255 * p),), anchor="mt")

              # Athlete count
              if p > 0.55:
                  ap = clamp((p - 0.55) / 0.3)
                  d.text((W/2, 1330), f"{n_ath} ATHLETES",
                         font=font(26, "med"),
                         fill=ACCENT + (int(220 * ap),), anchor="mt")

              # Breakdown pills
              if p > 0.7:
                  bp = clamp((p - 0.7) / 0.3)
                  items = [("GOLD", bd["gold"], GOLD), ("SILVER", bd["silver"], SILVER), ("BRONZE", bd["bronze"], BRONZE)]
                  pw, ph, gap = 260, 140, 20
                  x0 = (W - (3 * pw + 2 * gap)) // 2
                  for i, (label, n, col) in enumerate(items):
                      x = x0 + i * (pw + gap)
                      d.rounded_rectangle((x, 1440, x + pw, 1440 + ph), radius=24,
                          fill=(20, 28, 56, int(230 * bp)),
                          outline=col + (int(200 * bp),), width=2)
                      d.text((x + pw / 2, 1470), str(n), font=font(64, "bold"),
                             fill=col + (int(255 * bp),), anchor="mt")
                      d.text((x + pw / 2, 1548), label, font=font(22, "med"),
                             fill=MUTED + (int(255 * bp),), anchor="mt")

          # ══════════════════════════════════════════════════════
          #  DRAW — CARD
          # ══════════════════════════════════════════════════════
          def draw_card(img, ath, photo, prog, idx, total):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              # ── Progress bar top ──
              d.rectangle((0, 0, W, 6), fill=(25, 35, 65, 255))
              d.rectangle((0, 0, int(W * ((idx + clamp(prog)) / total)), 6),
                          fill=GOLD + (255,))

              # ── Counter ──
              d.text((W - 60, 60), f"{idx + 1:02d} / {total:02d}",
                     font=font(32, "med"), fill=MUTED + (255,), anchor="rt")

              # ── India tag ──
              d.text((60, 60), "IND", font=font(32, "bold"),
                     fill=SAFFRON + (255,), anchor="lt")

              # ── Card panel ──
              slide_y = int((1 - p) * 140)
              cx, cy = 70, 400 + slide_y
              cw, ch = W - 140, 1180
              mc, mc2 = MEDAL_RGB[ath["medal"]]

              # Card shadow
              shadow = Image.new("RGBA", (cw + 80, ch + 80), (0, 0, 0, 0))
              sd = ImageDraw.Draw(shadow)
              sd.rounded_rectangle((40, 40, cw + 40, ch + 40), radius=60,
                                   fill=(0, 0, 0, 120))
              shadow = shadow.filter(ImageFilter.GaussianBlur(30))
              img.paste(shadow, (cx - 40, cy - 40), shadow)

              # Card body — vertical gradient effect via two rects
              card_alpha = int(250 * clamp(p * 1.5))
              d.rounded_rectangle((cx, cy, cx + cw, cy + ch), radius=56,
                  fill=CARD_BG + (card_alpha,),
                  outline=CARD_BR + (int(255 * clamp(p * 1.5)),), width=2)

              # ── Left medal ribbon ──
              ribbon_w = 12
              ribbon_alpha = int(255 * clamp(p * 1.8))
              d.rounded_rectangle((cx + 34, cy + 34, cx + 34 + ribbon_w, cy + ch - 34),
                  radius=6, fill=mc + (ribbon_alpha,))

              # ── Top strip: sport code ──
              if p > 0.15:
                  tp = clamp((p - 0.15) / 0.25)
                  sport_short = ath["disc_desc"].split()[0].upper()[:12]
                  d.text((cx + 90, cy + 50), sport_short,
                         font=font(22, "bold"), fill=mc + (int(255 * tp),), anchor="lt")

              # ── Photo ──
              if p > 0.1:
                  pp = ease_back(clamp((p - 0.1) / 0.4))
                  psize = 400
                  px = cx + (cw - psize) // 2
                  py = cy + 130
                  cp = circular_photo(photo, psize, mc, ring_w=12, glow=True)
                  # scale-in animation
                  if pp < 1:
                      new_size = max(1, int((psize + 40) * pp))
                      cp = cp.resize((new_size, new_size), Image.LANCZOS)
                      offset = ((psize + 40) - new_size) // 2
                      img.paste(cp,
                                (px - 20 + offset, py - 20 + offset),
                                cp)
                  else:
                      img.paste(cp, (px - 20, py - 20), cp)

              # ── Medal pill ──
              if p > 0.4:
                  bp = ease_back(clamp((p - 0.4) / 0.35))
                  bw, bh = 320, 88
                  bx = cx + (cw - bw) // 2
                  by = cy + 610

                  # medal pill with gradient
                  pill_layer = Image.new("RGBA", (bw, bh), (0, 0, 0, 0))
                  pd = ImageDraw.Draw(pill_layer)
                  pd.rounded_rectangle((0, 0, bw, bh), radius=44, fill=mc + (255,))
                  # highlight
                  pd.rounded_rectangle((6, 6, bw - 6, bh // 2), radius=40,
                                       fill=(255, 255, 255, 40))
                  if bp < 1:
                      pill_layer = pill_layer.resize(
                          (max(1, int(bw * bp)), max(1, int(bh * bp))),
                          Image.LANCZOS)
                      pw_, ph_ = pill_layer.size
                      img.paste(pill_layer,
                                (bx + (bw - pw_) // 2, by + (bh - ph_) // 2),
                                pill_layer)
                  else:
                      img.paste(pill_layer, (bx, by), pill_layer)

                  # Medal text
                  label = ath["medal"].upper()
                  if ath["medal_count"] > 1:
                      label = f"{label}   ×{ath['medal_count']}"
                  d.text((cx + cw / 2, by + bh / 2 + 2),
                         label, font=font(32, "bold"),
                         fill=(8, 10, 20, int(255 * bp)), anchor="mm")

              # ── Name ──
              if p > 0.5:
                  np_ = clamp((p - 0.5) / 0.3)
                  name = ath["name"]
                  fname = font(72, "bold")
                  ny = cy + 750

                  # split if too wide
                  if d.textlength(name, font=fname) > cw - 120:
                      words = name.split()
                      mid = max(1, len(words) // 2)
                      line1 = " ".join(words[:mid])
                      line2 = " ".join(words[mid:])
                      # shrink if line still too long
                      while d.textlength(line1, font=fname) > cw - 120 and len(line1) > 4:
                          fname = font(fname.size - 4, "bold")
                      d.text((cx + cw / 2, ny), line1, font=fname,
                             fill=WHITE + (int(255 * np_),), anchor="mt")
                      d.text((cx + cw / 2, ny + 86), line2, font=fname,
                             fill=WHITE + (int(255 * np_),), anchor="mt")
                      ny += 86
                  else:
                      d.text((cx + cw / 2, ny), name, font=fname,
                             fill=WHITE + (int(255 * np_),), anchor="mt")

                  # gradient hairline under name
                  line_y = ny + 110
                  lw = int(lerp(0, cw - 200, np_))
                  d.rounded_rectangle((cx + (cw - lw) // 2, line_y,
                                       cx + (cw + lw) // 2, line_y + 2),
                                       radius=1, fill=mc + (int(160 * np_),))

              # ── Sport name ──
              if p > 0.68:
                  sp_ = clamp((p - 0.68) / 0.25)
                  d.text((cx + cw / 2, cy + 990),
                         ath["disc_desc"].upper(),
                         font=font(28, "med"),
                         fill=MUTED + (int(255 * sp_),), anchor="mt")

              # ── Event ──
              if p > 0.78:
                  ep = clamp((p - 0.78) / 0.22)
                  ev = ath["event"]
                  fe = font(24, "reg")
                  while d.textlength(ev, font=fe) > cw - 140 and len(ev) > 6:
                      ev = ev[:-2] + "…"
                  d.text((cx + cw / 2, cy + 1040), ev, font=fe,
                         fill=DIM + (int(255 * ep),), anchor="mt")

              # ── Stage pill ──
              if p > 0.88 and ath.get("stage"):
                  sp2 = clamp((p - 0.88) / 0.12)
                  stage = ath["stage"]
                  fstage = font(20, "bold")
                  tw = d.textlength(stage, font=fstage)
                  pw = tw + 48
                  ph = 46
                  px2 = cx + (cw - pw) / 2
                  py2 = cy + 1090
                  d.rounded_rectangle((px2, py2, px2 + pw, py2 + ph), radius=23,
                      fill=ACCENT + (int(50 * sp2),),
                      outline=ACCENT + (int(200 * sp2),), width=2)
                  d.text((cx + cw / 2, py2 + ph / 2), stage, font=fstage,
                         fill=(180, 200, 255, int(255 * sp2)), anchor="mm")

          # ══════════════════════════════════════════════════════
          #  DRAW — OUTRO
          # ══════════════════════════════════════════════════════
          def draw_outro(img, prog, total, bd, n_ath):
              d = ImageDraw.Draw(img, "RGBA")
              p = ease_out(clamp(prog))

              # Tricolor bar
              if p > 0:
                  bar_w = int(lerp(0, 300, p))
                  bx = (W - bar_w) // 2
                  by = int(lerp(500, 480, p))
                  d.rounded_rectangle((bx, by, bx + bar_w, by + 8), radius=4, fill=SAFFRON + (255,))
                  d.rounded_rectangle((bx, by + 12, bx + bar_w, by + 20), radius=4, fill=WHITE + (255,))
                  d.rounded_rectangle((bx, by + 24, bx + bar_w, by + 32), radius=4, fill=GREEN + (255,))

              d.text((W/2, 580), "INDIA", font=font(140, "bold"),
                     fill=WHITE + (int(255 * p),), anchor="mt")
              d.text((W/2, 780), f"{total} MEDALS", font=font(72, "bold"),
                     fill=GOLD + (int(255 * p),), anchor="mt")
              d.text((W/2, 900), f"{n_ath} ATHLETES",
                     font=font(32, "med"),
                     fill=ACCENT + (int(220 * p),), anchor="mt")

              y = 1080
              for label, n, col in [("GOLD", bd["gold"], GOLD),
                                    ("SILVER", bd["silver"], SILVER),
                                    ("BRONZE", bd["bronze"], BRONZE)]:
                  d.text((W/2 - 90, y), label, font=font(42, "med"),
                         fill=col + (int(255 * p),), anchor="rm")
                  d.text((W/2 + 90, y), str(n), font=font(54, "bold"),
                         fill=WHITE + (int(255 * p),), anchor="lm")
                  y += 110

              d.text((W/2, 1700), "THANK YOU FOR WATCHING",
                     font=font(32, "med"),
                     fill=MUTED + (int(255 * p),), anchor="mt")

          # ══════════════════════════════════════════════════════
          #  MAIN
          # ══════════════════════════════════════════════════════
          if not os.path.exists(DATA_IN):
              print(f"✗ {DATA_IN} not found"); sys.exit(1)

          print("Loading athletes…")
          with open(DATA_IN, encoding="utf-8") as f:
              data = json.load(f)

          athletes = collect_top(data, TEST_LIMIT)
          if not athletes:
              print("✗ No athletes"); sys.exit(1)

          n_ath = len(athletes)

          # Medal breakdown (unique)
          seen = set(); bd = {"gold": 0, "silver": 0, "bronze": 0}
          for a in data:
              for m in a.get("medals", []):
                  k = m["medal"] + "|" + m["event"]
                  if k in seen: continue
                  seen.add(k)
                  if m["medal"] in bd: bd[m["medal"]] += 1
          total = sum(bd.values())

          print(f"Medals total: {total}  {bd}")
          print(f"Showing {n_ath} athletes:")
          for a in athletes:
              print(f"  • {a['name']} — {a['medal'].upper()} ({a['disc_desc']})")

          print("Loading photos…")
          ok = 0
          for a in athletes:
              a["_photo"] = load_photo(a["photo_url"])
              if a["_photo"]: ok += 1
          print(f"  → {ok}/{n_ath} photos loaded")

          shutil.rmtree(FRAME_DIR, ignore_errors=True)
          Path(FRAME_DIR).mkdir(parents=True, exist_ok=True)

          counter = [0]
          def save(img):
              img.convert("RGB").save(f"{FRAME_DIR}/f_{counter[0]:05d}.png")
              counter[0] += 1

          print("Intro…")
          for f in range(INTRO_FRAMES):
              img = background().convert("RGBA")
              draw_intro(img, f / (INTRO_FRAMES - 1), total, bd, n_ath)
              save(img)

          print(f"Cards ({n_ath})…")
          for i, ath in enumerate(athletes):
              for f in range(CARD_FRAMES):
                  img = background().convert("RGBA")
                  draw_card(img, ath, ath["_photo"], f / (CARD_FRAMES - 1), i, n_ath)
                  save(img)

          print("Outro…")
          for f in range(OUTRO_FRAMES):
              img = background().convert("RGBA")
              draw_outro(img, f / (OUTRO_FRAMES - 1), total, bd, n_ath)
              save(img)

          print(f"✅ {counter[0]} frames")

          print("Encoding HLS…")
          Path(OUT_DIR).mkdir(parents=True, exist_ok=True)
          for old in Path(OUT_DIR).glob("*.ts"): old.unlink()
          for old in Path(OUT_DIR).glob("*.m3u8"): old.unlink()

          subprocess.run([
              "ffmpeg", "-y",
              "-framerate", str(FPS),
              "-i", f"{FRAME_DIR}/f_%05d.png",
              "-c:v", "libx264", "-preset", "medium", "-crf", "20",
              "-pix_fmt", "yuv420p",
              "-g", "60", "-keyint_min", "60", "-sc_threshold", "0",
              "-f", "hls", "-hls_time", "2", "-hls_playlist_type", "vod",
              "-hls_segment_filename", f"{OUT_DIR}/seg_%03d.ts",
              f"{OUT_DIR}/index.m3u8",
          ], check=True)

          shutil.rmtree("build", ignore_errors=True)
          files = sorted(Path(OUT_DIR).glob("*"))
          print(f"✅ HLS → {OUT_DIR}/ ({len(files)} files)")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add docs/ data/video-photos/ || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: rebuild HLS [skip ci]" && git push
          )
